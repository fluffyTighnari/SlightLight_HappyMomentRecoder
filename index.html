<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1A1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="微光">
<meta name="description" content="暖光里的一片光，接住那些亮了一下的瞬间。">
<title>微光</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root{
    --bg:#1A1411;
    --ink:#F1EADF;
    --ink-dim:#9A9184;
    --ink-faint:#6C6459;
    --line:rgba(255,238,214,.14);
    --line-soft:rgba(255,238,214,.08);
    --warm:#FFC98F;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    background:var(--bg);
    overscroll-behavior:none;
  }

  body{
    position:fixed;
    inset:0;
    overflow:hidden;
    font-family:var(--sans);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;
    -webkit-user-select:none;
  }

  :focus-visible{
    outline:1px solid rgba(255,214,175,.52);
    outline-offset:3px;
  }
  #jarSearch:focus-visible,.sheet textarea:focus-visible{outline:none;}

  canvas#room{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    animation:roomIn 2.4s ease both;
  }
  @keyframes roomIn{from{opacity:0;}to{opacity:1;}}

  .flash{
    position:fixed;
    inset:0;
    z-index:70;
    background:#FFF6E6;
    opacity:0;
    pointer-events:none;
  }
  .flash.fire{animation:flashFire .46s ease-out;}
  @keyframes flashFire{
    0%{opacity:0;}
    9%{opacity:.5;}
    100%{opacity:0;}
  }

  /* ---------- HUD ---------- */
  .hud{
    position:fixed;
    top:0;left:0;right:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top)) 22px 0;
    pointer-events:none;
    animation:hudIn 1.15s .18s both;
  }
  @keyframes hudIn{
    from{opacity:0;transform:translateY(-7px);}
    to{opacity:1;transform:none;}
  }

  .count{
    font-size:11px;
    letter-spacing:.22em;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
    transition:color .6s ease;
  }
  .count span{color:var(--ink-dim);display:inline-block;will-change:transform;}
  .count.bump span{animation:countBump .55s cubic-bezier(.16,1,.3,1);}
  @keyframes countBump{
    0%{opacity:.25;transform:translateY(3px);}
    100%{opacity:1;transform:none;}
  }

  .icon-btn{
    pointer-events:auto;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-faint);
    font-family:var(--sans);
    font-size:15px;
    line-height:1;
    display:grid;place-items:center;
    cursor:pointer;
    transition:border-color .4s,color .4s,background .4s;
  }
  .icon-btn:hover{border-color:var(--line);color:var(--ink-dim);background:rgba(255,235,205,.03);}
  .icon-btn:active{transform:scale(.94);}

  /* ---------- empty ---------- */
  .empty{
    position:fixed;
    left:0;right:0;
    top:38%;
    text-align:center;
    z-index:5;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.6s ease;
  }
  .empty.show{opacity:1;}
  .empty p{
    font-family:var(--serif);
    font-size:16px;
    line-height:2.1;
    letter-spacing:.16em;
    color:rgba(245,235,220,.42);
  }
  .empty p:last-child{
    font-size:13px;
    letter-spacing:.3em;
    color:rgba(245,235,220,.28);
    margin-top:4px;
  }

  /* ---------- echo ---------- */
  .echo{
    position:fixed;
    left:0;right:0;
    top:69%;
    z-index:6;
    text-align:center;
    pointer-events:none;
    opacity:0;
    transform:translateY(6px);
    transition:opacity 1.4s ease,transform 1.4s cubic-bezier(.16,1,.3,1);
  }
  .echo.show{opacity:1;transform:translateY(0);}
  .echo .line{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:var(--serif);
    font-size:14px;
    letter-spacing:.18em;
    color:rgba(245,235,220,.72);
    text-shadow:0 2px 14px rgba(30,16,10,.65);
  }
  .echo .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--warm);
    box-shadow:0 0 10px 2px rgba(255,200,150,.55);
    animation:echoPulse 3.4s ease-in-out infinite;
  }
  @keyframes echoPulse{
    0%,100%{opacity:.62;transform:scale(.9);}
    50%{opacity:1;transform:scale(1.18);}
  }
  .echo .quote{
    display:block;
    margin-top:14px;
    font-family:var(--serif);
    font-size:15px;
    line-height:1.9;
    letter-spacing:.08em;
    color:rgba(245,235,220,.5);
    text-shadow:0 2px 14px rgba(30,16,10,.7);
    max-width:76vw;
    margin-left:auto;margin-right:auto;
  }

  /* ---------- dock ---------- */
  .dock{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:38px;
    padding:0 24px calc(26px + env(safe-area-inset-bottom));
    width:100%;
    max-width:520px;
    pointer-events:none;
    animation:dockIn 1.25s .42s both;
  }
  @keyframes dockIn{
    from{opacity:0;transform:translateX(-50%) translateY(13px);}
    to{opacity:1;transform:translateX(-50%) translateY(0);}
  }

  .key{
    pointer-events:auto;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    border-radius:50%;
    background:transparent;
    border:1px solid var(--line-soft);
    color:var(--ink-dim);
    font-family:var(--sans);
    cursor:pointer;
    touch-action:none;
    -webkit-touch-callout:none;
    transition:border-color .35s ease,background .35s ease,color .35s ease,transform .18s ease;
  }
  .key:active{transform:scale(.96);}

  .key-side{
    width:58px;height:58px;
    border-color:var(--line-soft);
  }
  .key-side .glyph{
    font-family:var(--serif);
    font-size:19px;
    letter-spacing:.04em;
    color:rgba(233,227,214,.66);
    line-height:1;
    transition:color .35s;
  }
  .key-side .sub{
    font-size:8px;
    letter-spacing:.16em;
    color:var(--ink-faint);
    line-height:1;
    transform:translateY(1px);
  }
  .key-side:hover{border-color:var(--line);background:rgba(255,235,205,.025);}
  .key-side:hover .glyph{color:var(--ink);}
  .key-side.live{
    border-color:rgba(255,190,140,.5);
    background:rgba(255,190,140,.06);
  }
  .key-side.live .glyph{color:#FFE2BE;}

  .key-main{
    width:80px;height:80px;
    border-color:rgba(255,214,175,.32);
    background:radial-gradient(circle at 50% 42%,rgba(255,228,192,.20),rgba(255,190,140,.05) 58%,rgba(255,190,140,0) 74%);
    box-shadow:0 0 46px rgba(255,180,120,.10);
  }
  .key-main .core{
    width:7px;height:7px;border-radius:50%;
    background:#FFEBD3;
    box-shadow:0 0 14px 4px rgba(255,206,160,.65);
    animation:breathe 4.6s ease-in-out infinite;
  }
  .key-main::after{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:50%;
    border:1px solid rgba(255,214,175,.5);
    opacity:0;
    pointer-events:none;
  }
  .key-main.tap::after{animation:keyRing .85s cubic-bezier(.16,1,.3,1);}
  @keyframes keyRing{
    0%{opacity:.55;transform:scale(1);}
    100%{opacity:0;transform:scale(1.8);}
  }
  .key-main .label{
    font-family:var(--serif);
    font-size:11px;
    letter-spacing:.28em;
    text-indent:.28em;
    color:rgba(233,227,214,.6);
    margin-top:2px;
  }
  .key-main:hover{
    border-color:rgba(255,214,175,.5);
    background:radial-gradient(circle at 50% 42%,rgba(255,228,192,.26),rgba(255,190,140,.07) 58%,rgba(255,190,140,0) 74%);
  }
  .key-main:active .core{box-shadow:0 0 26px 10px rgba(255,220,180,.85);}

  @keyframes breathe{
    0%,100%{opacity:.62;transform:scale(1);}
    50%{opacity:1;transform:scale(1.16);}
  }

  /* ---------- 光瓶 ---------- */
  .jar-btn{
    position:fixed;
    right:16px;
    bottom:calc(148px + env(safe-area-inset-bottom));
    z-index:22;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1px;
    background:transparent;
    border:0;
    padding:0;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transform:translateY(5px);
    transition:opacity .9s ease,transform .9s cubic-bezier(.16,1,.3,1);
  }
  .jar-btn.show{opacity:.85;pointer-events:auto;transform:none;}
  .jar-btn:hover{opacity:1;}
  .jar-btn svg{
    display:block;width:40px;height:50px;
    filter:drop-shadow(0 0 8px rgba(255,190,130,.12));
  }
  .jar-btn .n{
    font-size:9.5px;
    letter-spacing:.14em;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  @keyframes jarpulse{
    0%{filter:drop-shadow(0 0 8px rgba(255,190,130,.15));}
    35%{filter:drop-shadow(0 0 18px rgba(255,210,165,.9));}
    100%{filter:drop-shadow(0 0 8px rgba(255,190,130,.15));}
  }
  .jar-btn.pulse svg{animation:jarpulse 1.2s ease-out;}

  #jarView{z-index:38;}
  .jar-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    width:100%;
  }
  .jar-vessel{
    position:relative;
    width:min(64vw,280px);
    height:min(56dvh,440px);
    border-radius:16px 16px 46px 46px;
    border:1px solid rgba(255,238,214,.15);
    background:linear-gradient(180deg,rgba(255,224,186,.06),rgba(255,190,140,.015) 42%,rgba(255,170,120,.06));
    box-shadow:
      inset 0 -30px 70px rgba(255,160,100,.08),
      inset 0 0 60px rgba(255,200,150,.03),
      0 30px 80px rgba(0,0,0,.45);
    overflow:hidden;
    opacity:0;
    transform:translateY(16px) scale(.985);
    transition:opacity .9s ease,transform 1s cubic-bezier(.16,1,.3,1);
  }
  #jarView.open .jar-vessel{opacity:1;transform:none;}
  .jar-vessel::before{
    content:"";
    position:absolute;left:7%;right:7%;top:0;height:12px;
    border-bottom:1px solid rgba(255,238,214,.14);
    background:linear-gradient(180deg,rgba(255,235,205,.07),rgba(255,235,205,0));
    z-index:2;
  }
  .jar-vessel canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .jar-vessel .shine{
    position:absolute;left:14%;top:9%;width:9%;height:50%;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0));
    border-radius:50%;
    filter:blur(9px);
    pointer-events:none;
    z-index:2;
  }
  .jar-meta{
    font-family:var(--serif);
    font-size:12px;
    letter-spacing:.18em;
    color:rgba(241,234,223,.42);
    text-align:center;
  }
  .jar-hint{
    margin-top:8px;
    font-size:10.5px;
    letter-spacing:.16em;
    color:rgba(241,234,223,.24);
  }
  .jar-reset{
    display:none;
    margin-top:12px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-dim);
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.14em;
    padding:7px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .jar-reset.show{display:inline-block;}
  .jar-reset:hover{color:var(--ink);border-color:var(--line);}
  .jar-browse{
    margin-top:15px;
    border:0;
    background:transparent;
    color:rgba(241,234,223,.34);
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.2em;
    padding:7px 0 3px;
    cursor:pointer;
    transition:color .35s ease;
  }
  .jar-browse:hover{color:rgba(241,234,223,.72);}

  /* 翻看 —— 一支举到光下的玻璃管 */
  .jar-sheet{
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% 34%,rgba(48,31,23,.55),rgba(12,8,6,.975) 66%),
      linear-gradient(180deg,rgba(26,18,14,.97),rgba(12,8,6,.99));
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    opacity:0;
    visibility:hidden;
    transform:translateY(22px);
    transition:opacity .38s ease,transform .55s cubic-bezier(.16,1,.3,1),visibility .55s;
  }
  .jar-sheet.open{opacity:1;visibility:visible;transform:none;}
  .browse-inner{
    display:flex;
    flex-direction:column;
    width:100%;
    max-width:460px;
    height:100%;
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom) + var(--kb,0px));
    transition:padding-bottom .24s ease;
  }
  .browse-top{
    display:flex;
    align-items:center;
    gap:14px;
    flex:0 0 auto;
  }
  .jar-sheet-back,.jar-sheet-close{
    flex:0 0 auto;
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid rgba(255,238,214,.09);
    background:transparent;
    color:var(--ink-dim);
    font-size:15px;
    line-height:1;
    display:grid;place-items:center;
    cursor:pointer;
    transition:color .3s,border-color .3s,transform .18s ease;
  }
  .jar-sheet-back:hover,.jar-sheet-close:hover{color:var(--ink);border-color:var(--line);}
  .browse-heading{flex:1;min-width:0;}
  .browse-title{
    font-family:var(--serif);
    font-size:18px;
    letter-spacing:.26em;
    color:rgba(241,234,223,.86);
    text-indent:.26em;
  }
  .jar-sheet-sub{
    margin-top:5px;
    font-size:10px;
    letter-spacing:.16em;
    color:rgba(241,234,223,.28);
    font-variant-numeric:tabular-nums;
  }
  .browse-tools{
    display:flex;
    align-items:center;
    gap:14px;
    flex:0 0 auto;
    margin-top:16px;
  }
  .jar-scopes{display:flex;gap:4px;flex:0 0 auto;}
  .jar-scope{
    border:0;
    background:transparent;
    border-radius:999px;
    padding:6px 10px;
    color:rgba(241,234,223,.3);
    font-family:var(--sans);
    font-size:10.5px;
    letter-spacing:.1em;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
    transition:color .3s,background .3s;
  }
  .jar-scope:hover{color:rgba(241,234,223,.6);}
  .jar-scope.on{color:rgba(255,232,205,.82);background:rgba(255,220,180,.07);}
  .jar-search{
    position:relative;
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
  }
  #jarSearch{
    flex:1;
    width:100%;
    min-width:0;
    border:0;
    border-bottom:1px solid rgba(255,238,214,.07);
    background:transparent;
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    letter-spacing:.02em;
    padding:6px 24px 8px 0;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
  }
  #jarSearch::placeholder{color:rgba(241,234,223,.2);font-size:12px;letter-spacing:.08em;}
  #jarSearch::-webkit-search-cancel-button{display:none;}
  #jarSearch:focus{border-bottom-color:rgba(255,214,175,.28);}
  .jar-search-clear{
    position:absolute;
    right:-2px;
    top:50%;
    transform:translateY(-50%);
    width:24px;height:24px;
    border:0;
    background:transparent;
    color:rgba(241,234,223,.32);
    font-family:var(--sans);
    font-size:14px;
    line-height:1;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:color .25s;
  }
  .jar-search-clear:hover{color:rgba(241,234,223,.72);}
  .jar-search-clear[hidden]{display:none;}

  .browse-vessel{
    position:relative;
    flex:1;
    min-height:0;
    margin-top:14px;
    border-radius:28px 28px 36px 36px;
    border:1px solid rgba(255,238,214,.115);
    background:linear-gradient(180deg,rgba(255,226,192,.035),rgba(255,196,150,.008) 45%,rgba(255,168,118,.048));
    box-shadow:
      inset 0 0 46px rgba(255,200,150,.022),
      inset 0 -70px 100px rgba(255,150,95,.055),
      0 26px 70px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .browse-rim{
    position:absolute;
    left:5%;right:5%;top:0;height:13px;
    border-bottom:1px solid rgba(255,238,214,.09);
    background:linear-gradient(180deg,rgba(255,235,205,.05),rgba(255,235,205,0));
    z-index:4;
    pointer-events:none;
  }
  .browse-vessel::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(112deg,rgba(255,255,255,.045) 0%,rgba(255,255,255,.012) 17%,rgba(255,255,255,0) 33%,rgba(255,255,255,0) 76%,rgba(255,255,255,.022) 100%);
    z-index:3;
    pointer-events:none;
  }
  .browse-foot{
    position:absolute;
    left:0;right:0;bottom:0;height:110px;
    background:radial-gradient(ellipse at 50% 112%,rgba(255,165,105,.10),rgba(255,165,105,0) 68%);
    z-index:2;
    pointer-events:none;
  }
  .jar-list{
    position:relative;
    z-index:1;
    height:100%;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:34px 14px 92px;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30px,#000 calc(100% - 56px),transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 30px,#000 calc(100% - 56px),transparent 100%);
  }
  .jar-list::-webkit-scrollbar{display:none;}
  .jar-day{
    display:flex;
    align-items:center;
    gap:11px;
    margin:26px 0 2px;
    font-family:var(--serif);
    font-size:10.5px;
    letter-spacing:.18em;
    color:rgba(241,234,223,.3);
    white-space:nowrap;
    pointer-events:none;
  }
  .jar-day:first-child{margin-top:0;}
  .jar-day::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg,rgba(255,238,214,.09),rgba(255,238,214,.015));
    transform-origin:left center;
  }
  .jar-sheet.reveal .jar-day{animation:jarDayIn .7s ease both;}
  .jar-sheet.reveal .jar-day::after{animation:jarDayLine .95s cubic-bezier(.16,1,.3,1) both;}
  .jar-sheet.reveal .jar-row{
    animation:jarRowIn .62s cubic-bezier(.16,1,.3,1) both;
    animation-delay:calc(var(--i,0) * 34ms + 40ms);
  }
  @keyframes jarDayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes jarDayLine{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes jarRowIn{
    from{opacity:0;transform:translateY(7px);}
    to{opacity:1;transform:none;}
  }
  .jar-row{
    --jit:0px;
    display:flex;
    align-items:flex-start;
    width:100%;
    padding:0;
    border:0;
    background:transparent;
    text-align:left;
    color:inherit;
    font:inherit;
    cursor:pointer;
  }
  .jar-anchor{
    position:relative;
    flex:0 0 44px;
    align-self:stretch;
  }
  .jar-anchor i{
    position:absolute;
    left:calc(3px + var(--jit));
    top:15px;
    width:5px;height:5px;
    border-radius:50%;
    background:#FFF9EE;
    box-shadow:0 0 9px 2px currentColor;
    animation:jarBreath 5.2s ease-in-out infinite;
    animation-delay:calc(var(--jit) * -0.6s);
    transition:box-shadow .4s ease,transform .4s ease;
  }
  @keyframes jarBreath{
    0%,100%{opacity:.68;}
    50%{opacity:1;}
  }
  @media (prefers-reduced-motion: reduce){
    .jar-anchor i{animation:none;}
  }
  .jar-anchor .jar-lead{
    position:absolute;
    left:calc(10px + var(--jit));
    right:2px;
    top:17px;
    height:1px;
    background:linear-gradient(90deg,rgba(255,238,214,.085),rgba(255,238,214,.015));
  }
  .jar-row:hover .jar-anchor i{box-shadow:0 0 14px 4px currentColor;transform:scale(1.15);}
  .jar-row:active .jar-anchor i{box-shadow:0 0 19px 6px currentColor;transform:scale(1.22);}
  .jar-row:active .jar-row-text{color:rgba(248,242,232,.98);}
  .jar-row:active .jar-thumb{filter:brightness(1.14);}
  .jar-row-main{flex:1;min-width:0;padding:10px 0 16px;}
  .jar-when{
    display:block;
    font-size:10px;
    letter-spacing:.14em;
    color:rgba(241,234,223,.28);
    font-variant-numeric:tabular-nums;
  }
  .jar-row-text{
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    margin-top:5px;
    font-family:var(--serif);
    font-size:14.5px;
    line-height:1.7;
    letter-spacing:.03em;
    color:rgba(233,227,214,.8);
    word-break:break-word;
    transition:color .35s ease;
  }

  .jar-quiet{color:rgba(233,227,214,.3);}
  .jar-badges{display:flex;gap:6px;margin-top:7px;}
  .jar-badge{
    font-size:9px;
    letter-spacing:.14em;
    color:rgba(233,227,214,.3);
    border:1px solid rgba(255,238,214,.08);

    padding:2px 7px;
  }
  .jar-thumb{
    position:relative;
    flex:0 0 42px;
    width:42px;height:42px;
    margin:10px 0 0 12px;
    border-radius:9px;
    border:1px solid rgba(255,238,214,.075);
    background:rgba(255,238,214,.045) center/cover no-repeat;
    box-shadow:0 6px 18px rgba(0,0,0,.35);

  }
  .jar-thumb i{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;

    font-style:normal;
    color:rgba(255,240,220,.5);
    background:rgba(8,6,5,.32);
  }
  .jar-empty{
    padding:clamp(110px,32vh,300px) 0 60px;
    text-align:center;
    font-family:var(--serif);
    font-size:13px;
    letter-spacing:.18em;
    color:rgba(233,227,214,.32);
  }

  /* ---------- hint / toast / rec ---------- */
  .float{
    position:fixed;
    left:50%;
    transform:translateX(-50%) translateY(6px);
    z-index:25;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease,transform .5s cubic-bezier(.16,1,.3,1),bottom .3s ease;
    white-space:nowrap;
  }
  .float.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}

  .hint{
    bottom:calc(132px + env(safe-area-inset-bottom));
    font-size:12px;
    letter-spacing:.1em;
    color:var(--ink-dim);
    background:rgba(255,240,220,.045);
    border:1px solid var(--line-soft);
    padding:9px 16px;
    border-radius:999px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .hint.stacked{bottom:calc(196px + env(safe-area-inset-bottom));}

  .toast{
    bottom:calc(130px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 12px 10px 18px;
    border:1px solid var(--line-soft);
    border-radius:999px;
    background:rgba(16,15,18,.72);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .toast .when{
    display:flex;align-items:center;gap:9px;
    font-family:var(--serif);
    font-size:13px;
    letter-spacing:.1em;
    color:rgba(233,227,214,.8);
    font-variant-numeric:tabular-nums;
  }
  .toast .when i{
    width:5px;height:5px;border-radius:50%;
    display:inline-block;
    box-shadow:0 0 9px 2px currentColor;
  }
  .toast button{
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-dim);
    font-family:var(--sans);
    font-size:11.5px;
    letter-spacing:.08em;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:color .3s,border-color .3s,background .3s;
  }
  .toast button:hover{color:var(--ink);border-color:var(--line);background:rgba(255,235,205,.04);}

  .reclabel{
    bottom:calc(132px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:9px;
    font-size:12px;letter-spacing:.14em;
    color:rgba(255,214,175,.8);
    font-variant-numeric:tabular-nums;
  }
  .reclabel .rec-dot{
    width:6px;height:6px;border-radius:50%;
    background:#FF9E6B;
    box-shadow:0 0 12px 3px rgba(255,158,107,.7);
    animation:recblink 1.6s ease-in-out infinite;
  }
  .reclabel .meter{
    display:flex;
    align-items:center;
    gap:2px;
    height:13px;
    margin:0 1px;
  }
  .reclabel .meter i{
    display:block;
    width:2px;
    height:100%;
    border-radius:2px;
    background:linear-gradient(180deg,rgba(255,226,190,.92),rgba(255,158,107,.5));
    transform:scaleY(.18);
    transform-origin:center;
    transition:transform .07s linear;
  }
  @keyframes recblink{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* ---------- overlays ---------- */
  .veil{
    position:fixed;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
    background:radial-gradient(ellipse at 50% 45%,rgba(38,24,18,.80),rgba(14,9,7,.96) 70%);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    opacity:0;visibility:hidden;
    transition:opacity .45s ease,visibility .45s;
  }
  .veil.open{opacity:1;visibility:visible;}

  /* viewer */
  .viewer-card{
    width:100%;max-width:520px;
    max-height:100%;
    overflow-y:auto;
    scrollbar-width:none;
    text-align:center;
    filter:blur(16px) saturate(.5);
    opacity:0;
    transform:scale(.985);
    transition:filter 1.1s ease,opacity 1.1s ease,transform 1.1s cubic-bezier(.16,1,.3,1);
  }
  .viewer-card::-webkit-scrollbar{display:none;}
  .veil.open .viewer-card{filter:blur(0) saturate(1);opacity:1;transform:scale(1);}
  .veil.open .viewer-card.letting-go{
    opacity:0;
    filter:blur(18px) saturate(.4);
    transform:scale(1.025) translateY(-8px);
    transition:opacity .45s ease,filter .55s ease,transform .65s cubic-bezier(.16,1,.3,1);
    pointer-events:none;
  }

  .v-meta{
    display:inline-flex;align-items:center;gap:10px;
    font-family:var(--serif);
    font-size:12.5px;
    letter-spacing:.16em;
    color:rgba(233,227,214,.5);
    font-variant-numeric:tabular-nums;
    margin-bottom:26px;
  }
  .v-meta i{
    width:5px;height:5px;border-radius:50%;
    display:inline-block;
    box-shadow:0 0 10px 2px currentColor;
  }
  .v-meta .lightname{color:rgba(233,227,214,.34);}

  .v-body{margin:0 auto;}
  .v-body.multi{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .v-body.multi img,.v-body.multi video{max-height:40dvh;}
  .v-body.multi .v-band{width:min(100%,360px);}
  .v-body img,.v-body video{
    display:block;
    max-width:100%;
    max-height:60dvh;
    margin:0 auto;
    border-radius:2px;
    box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 0 1px rgba(255,235,205,.06);
    background:rgba(255,240,220,.035);
    opacity:0;
    transition:opacity .75s ease;
  }
  .v-body img.ready,.v-body video.ready{opacity:1;}
  .v-body video{background:#000;cursor:pointer;}
  .v-video-wrap{
    position:relative;
    display:inline-block;
    max-width:100%;
    line-height:0;
  }
  .v-playbtn{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:56px;height:56px;
    border-radius:50%;
    border:1px solid rgba(255,235,205,.35);
    background:rgba(10,9,12,.5);
    color:rgba(255,240,220,.9);
    font-size:15px;
    line-height:1;
    display:grid;place-items:center;
    cursor:pointer;
    padding-left:3px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:opacity .35s ease,transform .35s ease;
  }
  .v-playbtn.hide{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.9);}
  .v-body .silence{
    font-family:var(--serif);
    font-size:17px;
    letter-spacing:.2em;
    line-height:2;
    color:rgba(233,227,214,.34);
    padding:44px 0;
  }

  .v-text{
    font-family:var(--serif);
    font-size:19px;
    line-height:1.95;
    letter-spacing:.06em;
    color:rgba(233,227,214,.88);
    margin:28px auto 0;
    max-width:26em;
    white-space:pre-wrap;
    word-break:break-word;
    animation:riseIn .95s .16s both;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(9px);}
    to{opacity:1;transform:none;}
  }

  .v-actions{
    display:flex;align-items:center;justify-content:center;gap:26px;
    margin-top:34px;
    font-size:12px;letter-spacing:.12em;
    animation:riseIn .95s .28s both;
  }
  .v-actions button{
    background:transparent;border:0;
    color:rgba(233,227,214,.46);
    font-family:var(--sans);
    font-size:12px;letter-spacing:.12em;
    cursor:pointer;
    padding:8px 4px;
    transition:color .3s;
  }
  .v-actions button:hover{color:rgba(240,234,223,.82);}
  .v-actions button.danger:hover{color:#FF9E6B;}
  .v-actions button.danger.armed{color:#FF9E6B;}

  .v-close{
    position:fixed;
    top:calc(18px + env(safe-area-inset-top));
    right:20px;
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid var(--line-soft);
    background:rgba(10,10,14,.5);
    color:var(--ink-dim);
    font-size:17px;line-height:1;
    display:grid;place-items:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    z-index:2;
    transition:transform .18s ease,color .3s,border-color .3s;
  }
  .v-close:hover{color:var(--ink);border-color:var(--line);}

  /* voice band */
  .v-band{
    display:flex;align-items:center;gap:14px;
    width:100%;
    height:58px;
    padding:0 20px;
    border:1px solid var(--line-soft);
    border-radius:999px;
    background:rgba(255,240,220,.025);
    cursor:pointer;
    transition:border-color .35s,background .35s;
  }
  .v-band:hover{border-color:var(--line);background:rgba(255,240,220,.04);}
  .v-band .play{
    width:0;height:0;
    border-left:9px solid rgba(255,214,175,.8);
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
    flex:none;
    transition:opacity .3s;
  }
  .v-band.playing .play{
    width:8px;height:11px;
    border:0;
    background:linear-gradient(90deg,rgba(255,214,175,.85) 0 3px,transparent 3px 5px,rgba(255,214,175,.85) 5px 8px);
  }
  .v-band .rail{
    position:relative;
    flex:1;
    height:1px;
    background:rgba(255,235,205,.14);
    overflow:hidden;
  }
  .v-band .rail::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(255,214,175,.9),rgba(255,214,175,.35));
    transform-origin:left center;
    transform:scaleX(var(--p,0));
    transition:transform .12s linear;
  }
  .v-band .dur{
    font-family:var(--serif);
    font-size:12px;
    letter-spacing:.1em;
    color:rgba(233,227,214,.4);
    font-variant-numeric:tabular-nums;
    flex:none;
  }

  /* ---------- sheet ---------- */
  .sheet{
    position:fixed;
    left:0;right:0;
    bottom:var(--kb,0px);
    z-index:50;
    padding:22px 22px calc(22px + env(safe-area-inset-bottom));
    background:rgba(22,15,12,.96);
    border-top:1px solid var(--line-soft);
    border-radius:22px 22px 0 0;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    transform:translateY(102%);
    transition:transform .5s cubic-bezier(.16,1,.3,1),bottom .24s ease;
  }
  .sheet.open{transform:translateY(0);}
  .sheet .cap{
    font-size:11px;letter-spacing:.2em;color:var(--ink-faint);
    margin-bottom:14px;
  }
  .sheet textarea{
    width:100%;
    min-height:92px;
    resize:none;
    background:transparent;
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:14px 16px;
    color:var(--ink);
    font-family:var(--serif);
    font-size:17px;
    line-height:1.8;
    letter-spacing:.04em;
    outline:none;
    transition:border-color .3s;
  }
  .sheet textarea:focus{border-color:rgba(255,214,175,.28);}
  .sheet textarea::placeholder{color:var(--ink-faint);}
  .sheet .row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:16px;
  }
  .sheet .row .count{font-size:10.5px;letter-spacing:.16em;color:var(--ink-faint);}
  .sheet .row .btns{display:flex;gap:10px;}
  .attach-row{display:flex;gap:10px;margin-bottom:16px;}
  .attach-btn{
    flex:1;
    padding:18px 8px;
    border:1px solid var(--line-soft);
    border-radius:14px;
    background:rgba(255,240,220,.025);
    color:rgba(241,234,223,.72);
    font-family:var(--serif);
    font-size:15px;
    letter-spacing:.12em;
    cursor:pointer;
    transition:background .3s,border-color .3s,color .3s,transform .15s ease;
  }
  .attach-btn:hover{
    background:rgba(255,240,220,.055);
    border-color:var(--line);
    color:var(--ink);
  }
  .attach-btn:disabled{opacity:.32;cursor:default;}
  .hold-bar{
    display:none;
    width:100%;
    height:64px;
    margin-bottom:16px;
    border-radius:999px;
    border:1px solid rgba(255,190,140,.32);
    background:rgba(255,190,140,.05);
    color:#FFE2BE;
    font-family:var(--serif);
    font-size:14px;
    letter-spacing:.14em;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    touch-action:none;
    -webkit-touch-callout:none;
    transition:background .3s,border-color .3s;
  }
  .hold-bar.show{display:flex;}
  .hold-bar.recording{
    background:rgba(255,158,107,.12);
    border-color:rgba(255,158,107,.6);
  }
  .hold-dot{
    width:8px;height:8px;border-radius:50%;
    background:#FF9E6B;
    box-shadow:0 0 12px 3px rgba(255,158,107,.6);
    animation:recblink 1.6s ease-in-out infinite;
  }
  .btn{
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-dim);
    font-family:var(--sans);
    font-size:12.5px;
    letter-spacing:.1em;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:color .3s,border-color .3s,background .3s,transform .15s ease;
  }
  .btn:hover{color:var(--ink);border-color:var(--line);background:rgba(255,235,205,.04);}
  .btn.solid{
    border-color:rgba(255,214,175,.32);
    color:#FFE7CC;
    background:rgba(255,190,140,.08);
  }
  .btn.solid:hover{background:rgba(255,190,140,.14);}

  /* ---------- settings ---------- */
  .panel{
    width:100%;max-width:430px;
    text-align:left;
    max-height:100%;
    overflow-y:auto;
    scrollbar-width:none;
    opacity:0;
    transform:translateY(12px);
    transition:opacity .5s ease,transform .7s cubic-bezier(.16,1,.3,1);
  }
  .veil.open .panel{opacity:1;transform:none;}
  .panel::-webkit-scrollbar{display:none;}
  .panel h2{
    font-family:var(--serif);
    font-size:19px;
    font-weight:400;
    letter-spacing:.24em;
    color:rgba(233,227,214,.85);
    margin-bottom:8px;
  }
  .panel .lede{
    font-size:12px;line-height:1.9;letter-spacing:.06em;
    color:var(--ink-faint);
    margin-bottom:28px;
  }
  .prow{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:15px 0;
    border-top:1px solid var(--line-soft);
    font-size:13px;
    letter-spacing:.08em;
    color:var(--ink-dim);
  }
  .prow b{
    font-weight:400;
    font-family:var(--serif);
    color:rgba(233,227,214,.8);
    font-variant-numeric:tabular-nums;

  .panel .acts{display:flex;flex-direction:column;gap:10px;margin-top:26px;}
  .panel .acts .btn{width:100%;text-align:center;padding:12px 18px;}
  .panel .note{
    margin-top:24px;
    font-size:11px;line-height:1.9;letter-spacing:.05em;
    color:var(--ink-faint);
  }
  .panel .note b{color:var(--ink-dim);font-weight:400;}

  /* ---------- 放映 ---------- */
  .screening{
    position:fixed;inset:0;z-index:55;
    background:#060608;
    display:none;
    align-items:center;justify-content:center;
    padding:calc(40px + env(safe-area-inset-top)) 26px calc(64px + env(safe-area-inset-bottom));
    cursor:pointer;
  }
  .screening.open{display:flex;}
  .s-stage{
    width:100%;max-width:560px;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .9s ease,transform 1.2s cubic-bezier(.16,1,.3,1);
  }
  .s-stage.show{opacity:1;transform:none;}
  .s-when{
    display:inline-flex;align-items:center;gap:10px;
    font-family:var(--serif);
    font-size:12px;letter-spacing:.18em;
    color:rgba(233,227,214,.42);
    font-variant-numeric:tabular-nums;
    margin-bottom:26px;
  }
  .s-when i{
    width:5px;height:5px;border-radius:50%;
    display:inline-block;
    box-shadow:0 0 10px 2px currentColor;
  }
  .s-media{margin:0 0 26px;}
  .s-media img,.s-media video{

    max-width:100%;
    max-height:52dvh;
    margin:0 auto;

  }
  .s-media img.ready,.s-media video.ready{opacity:1;}

  .s-media video{background:#000;}
  .s-voice{
    display:inline-flex;align-items:center;gap:14px;
    padding:0 20px;height:54px;

  }

  }
  .s-voice .dur{
    font-family:var(--serif);font-size:12px;letter-spacing:.1em;
    color:rgba(233,227,214,.4);
    font-variant-numeric:tabular-nums;
  }
  @keyframes wave{
    0%,100%{transform:scaleY(.3);}
    50%{transform:scaleY(1);}
  }
  .s-text{
    font-family:var(--serif);
    font-size:20px;
    line-height:1.95;
    letter-spacing:.06em;
    color:rgba(233,227,214,.88);
    max-width:24em;
    margin:0 auto;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .s-rail{
    position:fixed;
    left:50%;
    bottom:calc(30px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:120px;height:1px;
    background:rgba(255,235,205,.12);
    overflow:hidden;
  }
  .s-rail span{
    display:block;height:100%;
    background:linear-gradient(90deg,rgba(255,214,175,.85),rgba(255,214,175,.35));
    transform-origin:left center;
    transform:scaleX(0);
    transition:transform .9s cubic-bezier(.16,1,.3,1);
  }
  .s-close{
    position:fixed;
    top:calc(18px + env(safe-area-inset-top));
    right:20px;
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid var(--line-soft);
    background:rgba(10,10,14,.5);
    color:var(--ink-dim);
    font-size:17px;line-height:1;
    display:grid;place-items:center;
    cursor:pointer;
    z-index:2;
  }
  .s-close:hover{color:var(--ink);border-color:var(--line);}
  .s-hint{

<script>
(() => {
'use strict';

/* =========================================================
   0. 小工具
   ========================================================= */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function hash(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

const hash01 = (s) => (hash(s) % 100000) / 100000;

function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

const pad = (n) => String(n).padStart(2, '0');
const fmtTime = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDate = (ts) => { const d = new Date(ts); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; };
const fmtDur = (s) => `${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;

/* =========================================================
   1. 光
   ========================================================= */
const LIGHTS = [
  { id:'deep',  from:0,  to:5,  name:'深宵', color:'#9DB4FF' },
  { id:'dawn',  from:5,  to:8,  name:'晨光', color:'#FFD9A0' },
  { id:'day',   from:8,  to:16, name:'昼白', color:'#FFF6E0' },
  { id:'dusk',  from:16, to:19, name:'暮色', color:'#FF9E6B' },
  { id:'night', from:19, to:24, name:'夜灯', color:'#FFB86B' }
];
const LIGHT = Object.fromEntries(LIGHTS.map(l => [l.id, l]));

function lightAt(ts){
  const d = new Date(ts);
  const h = d.getHours() + d.getMinutes() / 60;
  const hit = LIGHTS.find(l => h >= l.from && h < l.to);
  return (hit || LIGHTS[1]).id;
}
const lightColor = (id) => (LIGHT[id] || LIGHT.night).color;

/* =========================================================
   2. 声音反馈
   ========================================================= */
let actx = null;
function audioCtx(){
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}

function tone(freq, dur, gain, type, delay){
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0);
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

function soundMoment(){ tone(1180, 0.07, 0.022, 'sine', 0); tone(760, 0.13, 0.014, 'sine', 0.03); }
function soundVoice(){ tone(420, 0.18, 0.016, 'sine', 0); tone(630, 0.16, 0.012, 'sine', 0.06); }
function soundLens(){ tone(980, 0.05, 0.018, 'sine', 0); tone(1420, 0.06, 0.012, 'sine', 0.05); }

/* 很轻的触感。iOS 会安静地忽略 */
function tapFeedback(ms){
  try{ if (navigator.vibrate) navigator.vibrate(ms || 8); }catch(e){}
}

let flashTimer = 0;
function screenFlash(warm){
  const el = $('#flash');
  if (!el) return;
  el.style.background = warm ? '#FFE4C6' : '#FFF6E6';
  el.classList.remove('fire');
  void el.offsetWidth;
  el.classList.add('fire');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove('fire'), 560);
}

/* =========================================================
   3. 数据
   ========================================================= */
const LS_KEY = 'weiguang.records.v1';
const DB_NAME = 'weiguang';
const DB_STORE = 'media';

function loadRecords(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}

let records = loadRecords();

function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(records)); }
  catch(e){ hint('空间满了，先导出再清理一点'); }
}

let dbPromise = null;
function openDB(){
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('no idb'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function db(){ return dbPromise || (dbPromise = openDB()); }

async function mediaPut(id, blob){
  const d = await db();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function mediaGet(id){
  const d = await db();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(DB_STORE, 'readonly');
    const r = tx.objectStore(DB_STORE).get(id);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}
async function mediaDel(id){
  try{
    const d = await db();
    await new Promise((resolve, reject) => {
      const tx = d.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){}
}

/* =========================================================
   4. 画布
   ========================================================= */const canvas = $('#room');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;
let sprites = {};

function spriteFor(id){
  if (sprites[id]) return sprites[id];
  const color = lightColor(id);
  const size = 96;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grd.addColorStop(0, 'rgba(255,255,255,0.98)');
  grd.addColorStop(0.10, rgba(color, 0.92));
  grd.addColorStop(0.30, rgba(color, 0.30));
  grd.addColorStop(0.62, rgba(color, 0.07));
  grd.addColorStop(1, rgba(color, 0));
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  sprites[id] = c;
  return c;
}

const grainTile = (() => {
  const size = 96;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4){
    const v = Math.random() * 255;
    img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 16;
  }
  g.putImageData(img, 0, 0);
  return c;
})();
let grainPattern = null;

/* 房间的光，跟着真实的时间走 */
function paletteForHour(h){
  if (h < 5)  return { top:'#2C1D29', bot:'#0F0B10', glow:'#D8B4E0', warm:'#FFC098', rose:'#B08FBC' };
  if (h < 8)  return { top:'#45291F', bot:'#130D0C', glow:'#FFD2B4', warm:'#FFE0C2', rose:'#F3B39E' };
  if (h < 16) return { top:'#4E2E27', bot:'#150E0C', glow:'#FFD9BE', warm:'#FFE7CE', rose:'#F5C0AC' };
  if (h < 19) return { top:'#4A241A', bot:'#160C09', glow:'#FFBF94', warm:'#FFD3AE', rose:'#EBA089' };
  return { top:'#38221A', bot:'#120B09', glow:'#FFC69C', warm:'#FFD6B0', rose:'#DFA48C' };
}

let palette = paletteForHour(new Date().getHours());
let paletteHour = new Date().getHours();

function syncThemeColor(){
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', palette.top);
}

function bloomCenter(){
  return { x: W * 0.5, y: H * 0.47 };
}
function bloomRadius(){
  return Math.min(W, H) * 0.46;
}

/* 背景里漂浮的、失焦的光斑 */
const bokehSprite = (() => {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grd.addColorStop(0.00, 'rgba(255,226,180,0.72)');
  grd.addColorStop(0.42, 'rgba(255,206,150,0.24)');
  grd.addColorStop(0.75, 'rgba(255,196,140,0.08)');
  grd.addColorStop(1.00, 'rgba(255,190,130,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  return c;
})();

let bokeh = [];

function buildBokeh(){
  bokeh = [];
  const count = W < 560 ? 14 : 20;
  for (let i = 0; i < count; i++){
    const s = hash('bokeh' + i);
    bokeh.push({
      x: ((s % 1000) / 1000),
      y: (((s >>> 10) % 1000) / 1000),
      r: 26 + (((s >>> 20) % 100) / 100) * 84,
      a: 0.09 + (((s >>> 3) % 100) / 100) * 0.11,
      vx: ((((s >>> 7) % 100) / 100) - 0.5) * 0.000003,
      vy: -(0.0000015 + (((s >>> 13) % 100) / 100) * 0.0000028),
      ph: (s % 628) / 100
    });
  }
}

let dust = [];

function buildDust(){
  dust = [];
  const count = W < 560 ? 34 : 52;
  for (let i = 0; i < count; i++){
    const s = hash('dust' + i);
    dust.push({
      x: ((s % 1000) / 1000),
      y: (((s >>> 10) % 1000) / 1000),
      r: 0.7 + (((s >>> 20) % 100) / 100) * 1.1,
      a: 0.10 + (((s >>> 3) % 100) / 100) * 0.16,
      vx: ((((s >>> 7) % 100) / 100) - 0.5) * 0.000004,
      vy: -(0.000002 + (((s >>> 13) % 100) / 100) * 0.0000045),
      ph: (s % 628) / 100
    });
  }
}

function buildScene(){
  palette = paletteForHour(new Date().getHours());
  paletteHour = new Date().getHours();
  syncThemeColor();
  buildBokeh();
  buildDust();
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildScene();
  grainPattern = null;
  rebuildMotes(true);
}

/* =========================================================
   5. 浮尘
   ========================================================= */
let motes = [];
let echoId = null;
let recLevel = 0;
let recordingMode = null; // 'voice' | null

const VISIBLE_MAX = 30;

function visibleRecords(){
  const sorted = records.slice().sort((a, b) => a.ts - b.ts);
  return sorted.length <= VISIBLE_MAX ? sorted : sorted.slice(-VISIBLE_MAX);
}

function rebuildMotes(immediate){
  const prev = new Map();
  for (const m of motes) prev.set(m.rec.id, m);

  const sorted = visibleRecords();
  const n = sorted.length;

  // 每两粒之间的距离都不一样，避免出现规整的圈
  const steps = sorted.map((rec) => 0.7 + hash01(rec.id) * 0.7);
  const total = steps.reduce((a, b) => a + b, 0) || 1;
  const suffix = new Array(n + 1).fill(0);
  for (let i = n - 1; i >= 0; i--) suffix[i] = suffix[i + 1] + steps[i];

  const scale = clamp(0.35 + 0.65 * Math.sqrt(n / VISIBLE_MAX), 0.35, 1);
  const fresh = prev.size === 0 && n > 1;
  const bornAt = performance.now();

  motes = sorted.map((rec, i) => {
    const s = hash(rec.id);
    const angle = ((s % 100000) / 100000) * Math.PI * 2 +
      ((((s >>> 12) % 1000) / 1000) - 0.5) * 0.10;
    // 里新外旧：只用比它更新的光，来决定它离中心多远
    const frac = suffix[i + 1] / total;
    const radiusFrac = (0.10 + 0.90 * Math.pow(frac, 0.7) * scale) *
      (0.985 + ((s >>> 20) % 1000) / 1000 * 0.03);
    const phase = (s % 6283) / 1000;
    const ageDays = Math.max(0, (Date.now() - rec.ts) / 86400000);
    const fade = clamp(1 - Math.log10(1 + ageDays) / 3.2, 0.55, 1);
    const old = prev.get(rec.id);
    return {
      rec, i, angle, radiusFrac, phase, fade,
      born: old ? 0 : (fresh ? bornAt + i * 42 : bornAt),
      x: old ? old.x : null,
      y: old ? old.y : null
    };
  });

  if (immediate){
    const t = performance.now();
    for (const m of motes){
      const [x, y] = moteTarget(m, t);
      m.x = x; m.y = y;
    }
  }

  if (n === 0) emptyEl.classList.add('show');
}

function moteTarget(m, t){
  const c = bloomCenter();
  const R = bloomRadius();
  const grow = 1 + 0.012 * Math.sin(t * 0.00035);
  const rot = t * 0.000006;
  const a = m.angle + rot;
  const r = R * m.radiusFrac * grow;
  return [c.x + Math.cos(a) * r, c.y + Math.sin(a) * r];
}

/* =========================================================
   6. 光斑 / 涟漪
   ========================================================= */
let flares = [];

function addFlare(x, y, lightId){
  flares.push({ x, y, lightId, born: performance.now() });
}

/* 指尖/指针靠近时，光会微微偏过来 */
const pointerAim = { x: 0, y: 0, on: 0, fade: 0 };

/* =========================================================
   7. 渲染
   ========================================================= */
let rafId = 0;
let lastGrainShift = 0;

function frame(now){
  rafId = requestAnimationFrame(frame);

  if (recordingMode === 'voice') readLevel();

  const hour = new Date().getHours();
  if (hour !== paletteHour){
    paletteHour = hour;
    palette = paletteForHour(hour);
    syncThemeColor();
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 房间的底色
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, palette.top);
  bg.addColorStop(1, palette.bot);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const c = bloomCenter();
  const R = bloomRadius();
  const breath = 0.86 + 0.14 * Math.sin(now * 0.00034);

  // 从窗边漫进来的光
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const win = ctx.createRadialGradient(W * 0.06, H * 0.02, 0, W * 0.06, H * 0.02, Math.max(W, H) * 0.85);
  win.addColorStop(0.00, rgba(palette.rose, 0.10 * breath));
  win.addColorStop(0.42, rgba(palette.rose, 0.035 * breath));
  win.addColorStop(1.00, rgba(palette.rose, 0));
  ctx.fillStyle = win;
  ctx.fillRect(0, 0, W, H);

  // 窗外那片落在墙上的暖光，缓慢地移
  const wx = W * 0.74 + Math.sin(now * 0.000060) * W * 0.045;
  const wy = H * 0.14 + Math.cos(now * 0.000050) * H * 0.035;
  const pool = ctx.createRadialGradient(wx, wy, 0, wx, wy, Math.max(W, H) * 0.58);
  pool.addColorStop(0.00, rgba(palette.warm, 0.15 * breath));
  pool.addColorStop(0.35, rgba(palette.warm, 0.055 * breath));
  pool.addColorStop(1.00, rgba(palette.warm, 0));
  ctx.fillStyle = pool;
  ctx.fillRect(0, 0, W, H);

  // 地面的一点反光
  const shade = ctx.createLinearGradient(0, H * 0.52, 0, H);
  shade.addColorStop(0, 'rgba(8,5,4,0)');
  shade.addColorStop(0.55, 'rgba(8,5,4,0.22)');
  shade.addColorStop(1, 'rgba(8,5,4,0.42)');
  ctx.fillStyle = shade;
  ctx.fillRect(0, H * 0.52, W, H * 0.48);

  const floor = ctx.createLinearGradient(0, H * 0.7, 0, H);
  floor.addColorStop(0, rgba(palette.warm, 0));
  floor.addColorStop(1, rgba(palette.warm, 0.075));
  ctx.fillStyle = floor;
  ctx.fillRect(0, H * 0.7, W, H * 0.3);
  ctx.restore();

  // 漂浮的失焦光斑
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bokeh){
    let x = b.x + b.vx * now;
    let y = b.y + b.vy * now;
    x -= Math.floor(x);
    y -= Math.floor(y);
    const px = x * (W + 160) - 80;
    const py = y * (H + 160) - 80;
    const r = b.r * (1 + 0.07 * Math.sin(now * 0.00021 + b.ph));
    ctx.globalAlpha = clamp(b.a * (0.72 + 0.28 * Math.sin(now * 0.00033 + b.ph)), 0, 1);
    ctx.drawImage(bokehSprite, px - r, py - r, r * 2, r * 2);
  }

  // 空气里的细尘
  for (const p of dust){
    let x = p.x + p.vx * now;
    let y = p.y + p.vy * now;
    x -= Math.floor(x);
    y -= Math.floor(y);
    ctx.globalAlpha = clamp(p.a * (0.6 + 0.4 * Math.sin(now * 0.0009 + p.ph)), 0, 1);
    ctx.fillStyle = '#FFF4E0';
    ctx.beginPath();
    ctx.arc(x * W, y * H, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 中心那一片光
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, R * 1.6);
  glow.addColorStop(0.00, rgba(palette.glow, 0.22 * breath));
  glow.addColorStop(0.28, rgba(palette.glow, 0.10 * breath));
  glow.addColorStop(0.62, rgba(palette.glow, 0.034 * breath));
  glow.addColorStop(1.00, rgba(palette.glow, 0));
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 底部灯的温度
  const lamp = ctx.createRadialGradient(W * 0.5, H * 1.02, 0, W * 0.5, H * 1.02, Math.max(W, H) * 0.6);
  lamp.addColorStop(0.00, rgba(palette.warm, 0.13));
  lamp.addColorStop(0.45, rgba(palette.warm, 0.04));
  lamp.addColorStop(1.00, rgba(palette.warm, 0));
  ctx.fillStyle = lamp;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // 录音时，光会轻轻颤
  if (recordingMode === 'voice'){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++){
      const phase = ((now * 0.00022) + i * 0.33) % 1;
      const r = 12 + phase * (90 + recLevel * 140);
      const a = (1 - phase) * (0.10 + recLevel * 0.22);
      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,214,175,${a.toFixed(3)})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
  }

  // 位置先走一步，好让光丝能连起来
  const n = motes.length;
  for (const m of motes){
    const [tx, ty] = moteTarget(m, now);
    if (m.x == null){ m.x = tx; m.y = ty; }
    m.x += (tx - m.x) * 0.05;
    m.y += (ty - m.y) * 0.05;
  }

  // 指针或指尖靠近时，光会微微看过来
  pointerAim.fade += ((pointerAim.on ? 1 : 0) - pointerAim.fade) * 0.085;

  // 一粒一粒的光
  const limit = 420;
  const stride = n > limit ? n / limit : 1;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i += stride){
    const m = motes[Math.floor(i)];

    const isEcho = echoId === m.rec.id;
    const pulse = 0.88 + 0.12 * Math.sin(now * 0.00095 + m.phase * 2.2);

    // 刚出现的光，慢慢亮起来
    const bornIn = m.born ? clamp((now - m.born) / 780, 0, 1) : 1;
    const inEase = 1 - Math.pow(1 - bornIn, 3);

    // 靠近指针的光，会亮一点、偏一点
    let prox = 0, mx = m.x, my = m.y;
    if (pointerAim.fade > 0.01 && inEase > 0){
      const ax = pointerAim.x - m.x;
      const ay = pointerAim.y - m.y;
      prox = clamp(1 - Math.hypot(ax, ay) / 118, 0, 1) * pointerAim.fade;
      if (prox > 0){
        mx += ax * 0.05 * prox;
        my += ay * 0.05 * prox;
      }
    }

    const alpha = clamp((0.42 + m.fade * 0.55) * pulse, 0.30, 1) *
      (isEcho ? 1.55 : 1) * inEase * (1 + prox * 0.35);
    const core = (2.2 + m.fade * 1.9) * (isEcho ? 1.7 : 1) *
      (0.72 + 0.28 * inEase) * (1 + prox * 0.35);
    const d = core * 13;

    const sp = spriteFor(m.rec.light);
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.drawImage(sp, mx - d/2, my - d/2, d, d);

    // 核心
    ctx.globalAlpha = clamp(alpha * 0.98, 0, 1);
    ctx.fillStyle = '#FFFCF4';
    ctx.beginPath();
    ctx.arc(mx, my, Math.max(0.9, core * 0.5), 0, Math.PI * 2);
    ctx.fill();

    const color = lightColor(m.rec.light);

    // 声音：一圈很淡的涟漪
    if (m.rec.type === 'voice'){
      const r = core * 2.5 + Math.sin(now * 0.0016 + m.phase) * 1.4;
      ctx.globalAlpha = clamp(alpha * 0.22, 0, 1);
      ctx.strokeStyle = rgba(color, 0.9);
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(mx, my, r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 照片：方形的光
    if (m.rec.type === 'photo'){
      const s = core * 2.0;
      ctx.globalAlpha = clamp(alpha * 0.32, 0, 1);
      ctx.fillStyle = rgba(color, 0.95);
      ctx.fillRect(mx - s/2, my - s/2, s, s);
    }

    // 视频：两层呼吸的光环
    if (m.rec.type === 'video'){
      const r = core * 2.9 + Math.sin(now * 0.0012 + m.phase) * 1.8;
      ctx.globalAlpha = clamp(alpha * 0.16, 0, 1);
      ctx.strokeStyle = rgba(color, 0.9);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(mx, my, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = clamp(alpha * 0.07, 0, 1);
      ctx.beginPath();
      ctx.arc(mx, my, r * 1.45, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (m.rec.extras && m.rec.extras.length){
      ctx.globalAlpha = clamp(alpha * 0.10, 0, 1);
      ctx.strokeStyle = rgba(color, 0.9);
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.arc(mx, my, core * 4.8, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (isEcho){
      ctx.globalAlpha = clamp(0.14 + 0.06 * Math.sin(now * 0.002), 0, 1);
      ctx.strokeStyle = rgba(color, 0.9);
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.arc(mx, my, core * 6.0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();

  // 新记录的光晕
  if (flares.length){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = flares.length - 1; i >= 0; i--){
      const f = flares[i];
      const age = (now - f.born) / 1600;
      if (age >= 1){ flares.splice(i, 1); continue; }
      const ease = 1 - Math.pow(1 - age, 2);
      const color = lightColor(f.lightId);
      const r = 6 + ease * 80;
      ctx.globalAlpha = Math.pow(1 - age, 2.2) * 0.55;
      ctx.strokeStyle = rgba(color, 0.9);
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.stroke();

      ctx.globalAlpha = Math.pow(1 - age, 2.0) * 0.92;
      const sp = spriteFor(f.lightId);
      const s = 96 * (1 + ease * 0.55);
      ctx.drawImage(sp, f.x - s/2, f.y - s/2, s, s);
    }
    ctx.restore();
  }

  // 一点的暗角，让中间更暖
  const vig = ctx.createRadialGradient(c.x, c.y, Math.min(W, H) * 0.24, c.x, c.y, Math.max(W, H) * 0.86);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(0.68, 'rgba(10,7,5,0.22)');
  vig.addColorStop(1, 'rgba(10,7,5,0.62)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // 颗粒
  if (!grainPattern) grainPattern = ctx.createPattern(grainTile, 'repeat');
  if (grainPattern){
    if (now - lastGrainShift > 110){
      lastGrainShift = now;
      try{
        grainPattern.setTransform(new DOMMatrix([1, 0, 0, 1, Math.random() * 96, Math.random() * 96]));
      }catch(e){}
    }
    ctx.save();
    ctx.globalAlpha = 0.26;
    ctx.fillStyle = grainPattern;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

   8. 交互：界面元素

const emptyEl = $('#empty');
const echoEl = $('#echo');
const echoWhenEl = $('#echoWhen');
const echoQuoteEl = $('#echoQuote');
const echoDotEl = $('#echoDot');
const countNum = $('#countNum');
const hintEl = $('#hint');
const toastEl = $('#toast');
const toastWhen = $('#toastWhen');
const toastDot = $('#toastDot');
const toastTextBtn = $('#toastTextBtn');
const recLabel = $('#recLabel');
const recTime = $('#recTime');
const recMeterBars = Array.from(document.querySelectorAll('#recMeter i'));

let hintTimer = 0;
function hint(text, ms){
  hintEl.textContent = text;
  hintEl.classList.toggle('stacked', toastEl.classList.contains('show'));
  hintEl.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.remove('show'), ms || 2800);
}

let toastTimer = 0;
let toastRecordId = null;
function showToast(rec){
  toastRecordId = rec.id;
  toastWhen.textContent = `${fmtTime(rec.ts)} · ${LIGHT[rec.light].name}`;
  toastDot.style.color = lightColor(rec.light);
  toastDot.style.background = lightColor(rec.light);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 5200);
}

let lastCount = -1;
function updateCount(){
  const n = records.length;
  countNum.textContent = n;
  if (lastCount !== -1 && n !== lastCount){
    const box = countNum.closest('.count');
    if (box){
      box.classList.remove('bump');
      void box.offsetWidth;
      box.classList.add('bump');
    }
  }
  lastCount = n;
  if (records.length > 0) emptyEl.classList.remove('show');
  else emptyEl.classList.add('show');
}

/* =========================================================
   9. 新增记录
   ========================================================= */
const newId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

async function addRecord(type, opts){
  opts = opts || {};
  const ts = Date.now();
  const rec = { id: newId(), type, ts, light: lightAt(ts), text: '' };
  if (opts.media) rec.media = opts.media;

  if (opts.blob){
    try{ await mediaPut(rec.id, opts.blob); }
    catch(e){ hint('这段痕迹没能存下来'); return null; }
  }

  records.push(rec);
  persist();
  rebuildMotes(false);
  updateCount();
  updateJar();
  if (records.length > VISIBLE_MAX) pulseJar();

  const m = motes[motes.length - 1];
  const [x, y] = moteTarget(m, performance.now());
  m.x = x; m.y = y;
  addFlare(x, y, rec.light);

  showToast(rec);
  if (records.length === 1){
    setTimeout(() => hint('点那粒光，可以回到那一刻', 4200), 5600);
  }
  return rec;
}

function layerCount(rec){
  return (rec.media ? 1 : 0) + ((rec.extras || []).length) + (rec.text ? 1 : 0);
}

async function addExtra(rec, kind, blob, media){
  if (!rec) return null;
  if (layerCount(rec) >= 4){
    hint('这粒光已经很满了');
    return null;
  }
  const mid = rec.id + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
  if (blob){
    try{ await mediaPut(mid, blob); }
    catch(e){ hint('这段痕迹没能存下来'); return null; }
  }
  rec.extras = rec.extras || [];
  rec.extras.push({ mid, kind, media });
  persist();
  return rec;
}

/* =========================================================
   11. 声
   ========================================================= */
const voiceKey = $('#voiceKey');
const secureOK = window.isSecureContext !== false;
const canMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

const voice = {
  state: 'idle', // idle | asking | recording | stopping
  stream: null,
  rec: null,
  chunks: [],
  start: 0,
  ac: null,
  analyser: null,
  buf: null,
  timer: 0,
  ticker: 0,
  wantStop: false
};

let voiceTargetId = null;

function pickMime(candidates){
  if (!window.MediaRecorder) return '';
  for (const m of candidates){
    try{ if (MediaRecorder.isTypeSupported(m)) return m; }catch(e){}
  }
  return '';
}

function readLevel(){
  if (!voice.analyser) return;
  voice.analyser.getByteTimeDomainData(voice.buf);
  let sum = 0;
  for (let i = 0; i < voice.buf.length; i++){
    const v = (voice.buf[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / voice.buf.length);
  const target = clamp(rms * 4.2, 0, 1);
  recLevel += (target - recLevel) * 0.28;
}

function paintRecMeter(now){
  for (let i = 0; i < recMeterBars.length; i++){
    const wob = 0.5 + 0.5 * Math.sin(now * 0.011 + i * 1.9);
    const v = clamp(0.16 + recLevel * 1.15 * (0.32 + 0.68 * wob), 0.16, 1);
    recMeterBars[i].style.transform = `scaleY(${v.toFixed(3)})`;
  }
}

async function beginVoice(targetId){
  if (voice.state !== 'idle' || recordingMode) return;
  if (!secureOK || !canMic){
    hint('录音需要 https 或 localhost 打开');
    return;
  }
  if (!window.MediaRecorder){
    hint('这个浏览器不支持录音');
    return;
  }

  voiceTargetId = targetId || null;
  voice.state = 'asking';
  voice.wantStop = false;
  voiceKey.classList.add('live');

  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  }catch(e){
    voice.state = 'idle';
    voiceKey.classList.remove('live');
    voiceTargetId = null;
    hint('没有拿到麦克风');
    return;
  }

  if (voice.wantStop){
    stream.getTracks().forEach(t => t.stop());
    voice.state = 'idle';
    voiceKey.classList.remove('live');
    voiceTargetId = null;
    hint('按住不放，说完再松手');
    return;
  }

  voice.stream = stream;
  voice.chunks = [];
  const mime = pickMime(['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac']);

  try{
    voice.rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  }catch(e){
    stream.getTracks().forEach(t => t.stop());
    voice.state = 'idle';
    voiceKey.classList.remove('live');
    voiceTargetId = null;
    hint('这个浏览器不支持录音');
    return;
  }

  voice.rec.ondataavailable = (e) => { if (e.data && e.data.size) voice.chunks.push(e.data); };
  voice.rec.onstop = finishVoice;
  voice.rec.start(200);

  // 电平
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    voice.ac = new AC();
    const src = voice.ac.createMediaStreamSource(stream);
    voice.analyser = voice.ac.createAnalyser();
    voice.analyser.fftSize = 256;
    voice.buf = new Uint8Array(voice.analyser.fftSize);
    src.connect(voice.analyser);
  }catch(e){ voice.analyser = null; }

  voice.start = performance.now();
  voice.state = 'recording';
  recordingMode = 'voice';
  recLabel.classList.add('show');

  const tick = () => {
    if (voice.state !== 'recording') return;
    const el = (performance.now() - voice.start) / 1000;
    recTime.textContent = fmtDur(el);
    paintRecMeter(performance.now());
    voice.ticker = requestAnimationFrame(tick);
  };
  tick();

  voice.timer = setTimeout(() => stopVoice(true), 30000);
  soundVoice();
}

function stopVoice(auto){
  if (voice.state !== 'recording') return;
  voice.state = 'stopping';
  clearTimeout(voice.timer);
  cancelAnimationFrame(voice.ticker);
  try{ if (voice.rec && voice.rec.state !== 'inactive') voice.rec.stop(); }
  catch(e){ finishVoice(); }
  if (auto) hint('已经替你收好了');
}

async function finishVoice(){
  if (voice.state === 'idle') return;
  const dur = (performance.now() - voice.start) / 1000;

  recordingMode = null;
  recLabel.classList.remove('show');
  voiceKey.classList.remove('live');
  recLevel = 0;
  recMeterBars.forEach((b) => { b.style.transform = 'scaleY(.18)'; });

  try{ voice.stream && voice.stream.getTracks().forEach(t => t.stop()); }catch(e){}
  try{ voice.ac && voice.ac.close(); }catch(e){}

  const chunks = voice.chunks;
  const mime = (voice.rec && voice.rec.mimeType) || 'audio/webm';

  voice.stream = null; voice.rec = null; voice.chunks = [];
  voice.ac = null; voice.analyser = null; voice.buf = null;
  voice.state = 'idle';

  if (!chunks.length || dur < 0.6){
    hint('太短了，按住说完再松手');
    return;
  }

  const blob = new Blob(chunks, { type: mime });
  if (blob.size < 900){
    hint('太短了，按住说完再松手');
    return;
  }

  const media = { mime: blob.type || mime, bytes: blob.size, dur: Math.round(dur * 10) / 10 };
  const targetId = voiceTargetId;
  voiceTargetId = null;

  if (targetId){
    const target = records.find(r => r.id === targetId);
    if (target){
      const added = await addExtra(target, 'voice', blob, media);
      if (added){
        soundMoment();
        closeAttachSheet();
        openViewer(target);
      }
    }
    return;
  }

  const rec = await addRecord('voice', { blob, media });
  if (rec) soundMoment();
}

voiceKey.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try{ voiceKey.setPointerCapture && voiceKey.setPointerCapture(e.pointerId); }catch(err){}
  beginVoice();
});
voiceKey.addEventListener('pointerup', (e) => {
  e.preventDefault();
  if (voice.state === 'asking') voice.wantStop = true;
  else stopVoice(false);
});
voiceKey.addEventListener('pointercancel', () => {
  if (voice.state === 'asking') voice.wantStop = true;
  else stopVoice(false);
});
voiceKey.addEventListener('contextmenu', (e) => e.preventDefault());

const cameraEl = $('#camera');
const camVideo = $('#camVideo');
const camHint = $('#camHint');
const shutter = $('#shutter');
const ringCircle = shutter.querySelector('.ring circle');

const cam = {
  stream: null,
  mode: 'idle', // idle | pending | video
  rec: null,
  chunks: [],
  start: 0,
  holdTimer: 0,
  ringRaf: 0,
  hasAudio: false,
  photoOnly: false,
  attachTo: null,
  vw: 0,
  vh: 0
};

const VIDEO_LIMIT = 5000;
const PHOTO_MAX = 1600;

function videoMime(){
  return pickMime([
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ]);
}

async function openCamera(attachTo){
  if (recordingMode) return;
  if (cameraEl.classList.contains('open')) return;
  if (!secureOK || !canMic || !navigator.mediaDevices.getUserMedia){
    hint('取景需要 https 或 localhost 打开');
    return;
  }
  cameraEl.classList.add('open');
  camHint.textContent = '启动中…';
  cam.mode = 'idle';
  cam.attachTo = attachTo || null;

  try{
    cam.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });
    cam.hasAudio = true;
  }catch(e){
    try{
      cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      cam.hasAudio = false;
    }catch(e2){
      camHint.textContent = '打不开取景器';
      setTimeout(closeCamera, 1200);
      return;
    }
  }

  camVideo.srcObject = cam.stream;
  try{ await camVideo.play(); }catch(e){}
  camHint.textContent = window.MediaRecorder ? '轻点拍照 · 按住录像' : '轻点拍照';
}

function closeCamera(){
  clearTimeout(cam.holdTimer);
  cancelAnimationFrame(cam.ringRaf);
  cam.photoOnly = false;
  cam.attachTo = null;
  try{ if (cam.rec && cam.rec.state !== 'inactive') cam.rec.stop(); }catch(e){}
  cam.rec = null; cam.chunks = []; cam.mode = 'idle';
  try{ cam.stream && cam.stream.getTracks().forEach(t => t.stop()); }catch(e){}
  cam.stream = null;
  camVideo.srcObject = null;
  cameraEl.classList.remove('open', 'recording');
  ringCircle.style.strokeDashoffset = 289;
}

function startVideoRecorder(){
  if (!window.MediaRecorder || !cam.stream) return false;
  const mime = videoMime();
  try{
    cam.rec = mime
      ? new MediaRecorder(cam.stream, { mimeType: mime, videoBitsPerSecond: 1800000 })
      : new MediaRecorder(cam.stream, { videoBitsPerSecond: 1800000 });
  }catch(e){ return false; }

  cam.chunks = [];
  cam.rec.ondataavailable = (e) => { if (e.data && e.data.size) cam.chunks.push(e.data); };
  cam.rec.onstop = finishVideo;
  cam.rec.start(200);
  cam.start = performance.now();
  cam.vw = camVideo.videoWidth || 0;
  cam.vh = camVideo.videoHeight || 0;
  return true;
}

function stopVideoRecorder(){
  if (!cam.rec) return;
  try{ if (cam.rec.state !== 'inactive') cam.rec.stop(); }catch(e){ finishVideo(); }
}

async function finishVideo(){
  const dur = (performance.now() - cam.start) / 1000;
  const chunks = cam.chunks;
  const mime = (cam.rec && cam.rec.mimeType) || 'video/webm';
  cam.rec = null; cam.chunks = [];

  cameraEl.classList.remove('recording');
  cancelAnimationFrame(cam.ringRaf);
  ringCircle.style.strokeDashoffset = 289;

  if (!chunks.length || dur < 0.5){ return; }

  const blob = new Blob(chunks, { type: mime });
  const targetId = cam.attachTo;
  const media = { mime: blob.type || mime, bytes: blob.size, dur: Math.round(dur * 10) / 10 };
  if (cam.vw && cam.vh){ media.w = cam.vw; media.h = cam.vh; }

  screenFlash(true);
  tapFeedback(14);
  closeCamera();

  if (targetId){
    const target = records.find(r => r.id === targetId);
    if (target){
      const added = await addExtra(target, 'video', blob, media);
      if (added){ soundMoment(); openViewer(target); }
    }
    return;
  }

  const rec = await addRecord('video', { blob, media });
  if (rec) soundMoment();
}

function takePhoto(){
  if (!cam.stream) return;
  if (!camVideo.videoWidth){ hint('再等一下，取景器还没准备好'); return; }

  screenFlash(false);
  tapFeedback(12);

  const vw = camVideo.videoWidth, vh = camVideo.videoHeight;
  const scale = Math.min(1, PHOTO_MAX / Math.max(vw, vh));
  const w = Math.round(vw * scale), h = Math.round(vh * scale);

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.drawImage(camVideo, 0, 0, w, h);

  c.toBlob(async (blob) => {
    if (!blob) return;
    const targetId = cam.attachTo;
    closeCamera();

    const media = { mime: blob.type || 'image/jpeg', bytes: blob.size, w, h };

    if (targetId){
      const target = records.find(r => r.id === targetId);
      if (target){
        const added = await addExtra(target, 'photo', blob, media);
        if (added){ soundLens(); openViewer(target); }
      }
      return;
    }

    const rec = await addRecord('photo', { blob, media });
    if (rec) soundLens();
  }, 'image/jpeg', 0.86);
}

function updateRing(){
  if (cam.mode !== 'video') return;
  const el = performance.now() - cam.start;
  const p = clamp(el / VIDEO_LIMIT, 0, 1);
  ringCircle.style.strokeDashoffset = String(289 * (1 - p));
  if (p >= 1){ stopVideoRecorder(); return; }
  cam.ringRaf = requestAnimationFrame(updateRing);
}

shutter.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (cam.mode !== 'idle') return;
  try{ shutter.setPointerCapture && shutter.setPointerCapture(e.pointerId); }catch(err){}

  if (!window.MediaRecorder){ cam.photoOnly = true; return; }

  cam.mode = 'pending';
  const ok = startVideoRecorder();
  if (!ok){ cam.mode = 'idle'; cam.photoOnly = true; return; }

  cam.holdTimer = setTimeout(() => {
    if (cam.mode !== 'pending') return;
    cam.mode = 'video';
    cameraEl.classList.add('recording');
    camHint.textContent = '松手收下这五秒';
    updateRing();
  }, 260);
});

function shutterRelease(){
  if (cam.mode === 'pending'){
    clearTimeout(cam.holdTimer);
    cam.mode = 'idle';
    // 丢掉这一小段，改拍照
    try{
      if (cam.rec){
        cam.rec.onstop = null;
        if (cam.rec.state !== 'inactive') cam.rec.stop();
      }
    }catch(e){}
    cam.rec = null; cam.chunks = [];
    takePhoto();
    return;
  }
  if (cam.mode === 'video'){
    cam.mode = 'idle';
    stopVideoRecorder();
  }
}

shutter.addEventListener('pointerup', (e) => {
  e.preventDefault();
  if (cam.photoOnly){ cam.photoOnly = false; takePhoto(); return; }
  shutterRelease();
});
shutter.addEventListener('pointercancel', () => { if (cam.mode === 'video'){ cam.mode = 'idle'; stopVideoRecorder(); } });
shutter.addEventListener('contextmenu', (e) => e.preventDefault());
$('#camClose').addEventListener('click', closeCamera);

const viewerEl = $('#viewer');
const viewerCard = $('#viewerCard');
let viewerOpenId = null;
let viewerCleanup = null;
let viewerToken = 0;

function closeViewer(){
  viewerToken++;
  viewerEl.classList.remove('open');
  viewerCard.classList.remove('letting-go');
  if (viewerCleanup){ viewerCleanup(); viewerCleanup = null; }
  viewerOpenId = null;
  if (jarSheetOpen) renderJarList();
  setTimeout(() => { if (!viewerEl.classList.contains('open')) viewerCard.innerHTML = ''; }, 500);
}

function openViewer(rec){
  const token = ++viewerToken;
  viewerOpenId = rec.id;
  viewerCard.classList.remove('letting-go');
  if (viewerCleanup){ viewerCleanup(); viewerCleanup = null; }
  const color = lightColor(rec.light);
  const lightName = (LIGHT[rec.light] || {}).name || '';

  const layers = [];
  if (rec.media) layers.push({ kind: rec.type, media: rec.media, mid: rec.id });
  (rec.extras || []).forEach((x) => layers.push({ kind: x.kind, media: x.media, mid: x.mid }));

  let bodyHtml = '';
  if (layers.length){
    bodyHtml = layers.map((l, i) => {
      if (l.kind === 'voice'){
        return `<button class="v-band" data-i="${i}"><span class="play"></span><span class="rail"></span><span class="dur">${fmtDur((l.media && l.media.dur) || 0)}</span></button>`;
      }
      const wh = (l.media && l.media.w && l.media.h)
        ? ` width="${l.media.w}" height="${l.media.h}"`
        : '';
      if (l.kind === 'photo'){
        return `<img data-i="${i}" alt=""${wh}>`;
      }
      return `<div class="v-video-wrap" data-i="${i}"><video playsinline preload="metadata"${wh}></video><button class="v-playbtn" aria-label="播放">▶</button></div>`;
    }).join('');
  }else{
    bodyHtml = rec.text ? '' : `<div class="silence">这一刻，我在这里。</div>`;
  }

  viewerCard.innerHTML = `
    <div class="v-meta">
      <i style="color:${color};background:${color}"></i>
      <span>${fmtRel(rec.ts)}</span>
      <span class="lightname">${lightName}</span>
    </div>
    <div class="v-body ${layers.length > 1 ? 'multi' : ''}">${bodyHtml}</div>
    <div class="v-text" id="vText" ${rec.text ? '' : 'style="display:none"'}></div>
    <div class="v-actions">
      <button id="vAddText">+ 再加一点</button>
      <button id="vDelete" class="danger">放走它</button>
    </div>
  `;

  const vText = $('#vText');
  if (rec.text) vText.textContent = rec.text;

  viewerEl.classList.add('open');

  const urls = [];
  const cleanups = [];

  layers.forEach((layer, i) => {
    const el = viewerCard.querySelector(`[data-i="${i}"]`);
    if (!el) return;

    mediaGet(layer.mid).then((blob) => {
      if (!blob || token !== viewerToken || viewerOpenId !== rec.id) return;
      const url = URL.createObjectURL(blob);
      urls.push(url);

      if (layer.kind === 'photo'){
        el.addEventListener('load', () => el.classList.add('ready'), { once: true });
        el.addEventListener('error', () => {
          el.classList.add('ready');
          el.style.opacity = '0.35';
        }, { once: true });
        el.src = url;
      }else if (layer.kind === 'video'){
        const vid = el.querySelector('video');
        const btn = el.querySelector('.v-playbtn');
        if (!vid) return;
        const markReady = () => vid.classList.add('ready');
        vid.addEventListener('loadeddata', markReady);
        vid.addEventListener('canplay', markReady);
        vid.addEventListener('error', () => {
          vid.classList.add('ready');
          el.style.opacity = '0.35';
        }, { once: true });
        vid.src = url;
        const toggle = () => {
          if (vid.paused) vid.play().catch(() => {});
          else vid.pause();
        };
        const onClickVideo = () => toggle();
        const onPlay = () => btn && btn.classList.add('hide');
        const onPause = () => btn && btn.classList.remove('hide');
        const onEnded = () => { if (btn){ btn.classList.remove('hide'); btn.textContent = '↺'; } };
        vid.addEventListener('click', onClickVideo);
        vid.addEventListener('play', onPlay);
        vid.addEventListener('pause', onPause);
        vid.addEventListener('ended', onEnded);
        if (btn) btn.addEventListener('click', () => vid.play().catch(() => {}));
        cleanups.push(() => {
          vid.pause();
          vid.removeEventListener('click', onClickVideo);
          vid.removeEventListener('play', onPlay);
          vid.removeEventListener('pause', onPause);
          vid.removeEventListener('ended', onEnded);
        });
      }else if (layer.kind === 'voice'){
        const audio = new Audio(url);
        const band = el;
        const rail = band.querySelector('.rail');
        const onBandClick = () => {
          if (audio.paused) audio.play().catch(() => {});
          else audio.pause();
        };
        band.addEventListener('click', onBandClick);
        const onPlay = () => band.classList.add('playing');
        const onPause = () => band.classList.remove('playing');
        const onTime = () => {
          const d = audio.duration || (layer.media && layer.media.dur) || 1;
          if (rail) rail.style.setProperty('--p', String(clamp(audio.currentTime / d, 0, 1)));
        };
        const onEnded = () => { band.classList.remove('playing'); if (rail) rail.style.setProperty('--p', '0'); };
        audio.addEventListener('play', onPlay);
        audio.addEventListener('pause', onPause);
        audio.addEventListener('timeupdate', onTime);
        audio.addEventListener('ended', onEnded);
        cleanups.push(() => {
          audio.pause();
          band.removeEventListener('click', onBandClick);
          audio.removeEventListener('play', onPlay);
          audio.removeEventListener('pause', onPause);
          audio.removeEventListener('timeupdate', onTime);
          audio.removeEventListener('ended', onEnded);
        });
      }
    }).catch(() => {
      el.style.opacity = '0.35';
      const vid = el.querySelector && el.querySelector('video');
      if (vid) vid.classList.add('ready');
    });
  });

  $('#vAddText').addEventListener('click', () => openAttachSheet(rec.id));
  $('#vDelete').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    if (btn.dataset.step !== '1'){
      btn.dataset.step = '1';
      btn.textContent = '再点一次，放走它';
      btn.classList.add('armed');
      tapFeedback(5);
      setTimeout(() => {
        if (btn.isConnected){
          btn.dataset.step = '';
          btn.textContent = '放走它';
          btn.classList.remove('armed');
        }
      }, 3200);
      return;
    }
    if (btn.dataset.letting) return;
    btn.dataset.letting = '1';
    viewerCard.classList.add('letting-go');
    tapFeedback(18);
    setTimeout(() => {
      deleteRecord(rec.id);
      closeViewer();
      hint('放走了');
    }, 430);
  });

  viewerCleanup = () => {
    cleanups.forEach(fn => { try{ fn(); }catch(e){} });
    urls.forEach(u => { try{ URL.revokeObjectURL(u); }catch(e){} });
  };
}

viewerEl.addEventListener('click', (e) => { if (e.target === viewerEl) closeViewer(); });
$('#viewerClose').addEventListener('click', closeViewer);

async function deleteRecord(id){
  const rec = records.find(r => r.id === id);
  records = records.filter(r => r.id !== id);
  persist();
  await mediaDel(id);
  if (rec && rec.extras){
    for (const e of rec.extras) await mediaDel(e.mid);
  }
  rebuildMotes(true);
  updateCount();
  updateJar();
}

/* =========================================================
   13.5 光瓶
   ========================================================= */
const jarBtn = $('#jarBtn');
const jarCountEl = $('#jarCount');
const jarView = $('#jarView');
const jarVessel = $('#jarVessel');
const jarCanvas = $('#jarCanvas');
const jarCtx = jarCanvas.getContext('2d');
const jarTotalEl = $('#jarTotal');

let jarParticles = [];
let jarRaf = 0;
let jarW = 0, jarH = 0, jarDpr = 1;
let jarScale = 1, jarPanX = 0, jarPanY = 0;

const jarReset = $('#jarReset');
const jarGesture = {
  pointers: new Map(),
  start: null,
  pinch: null,
  tapAt: 0
};

function storedRecords(){
  const sorted = records.slice().sort((a, b) => a.ts - b.ts);
  if (sorted.length <= VISIBLE_MAX) return [];
  return sorted.slice(0, sorted.length - VISIBLE_MAX);
}

function updateJar(){
  const n = storedRecords().length;
  jarCountEl.textContent = n;
  jarTotalEl.textContent = n;
  jarBtn.classList.toggle('show', n > 0);
  if (jarView.classList.contains('open')) buildJarParticles();
  if (jarSheetOpen) renderJarList();
}

function pulseJar(){
  jarBtn.classList.remove('pulse');
  void jarBtn.offsetWidth;
  jarBtn.classList.add('pulse');
  setTimeout(() => jarBtn.classList.remove('pulse'), 1300);
}

function buildJarParticles(){
  const stored = storedRecords(); // 旧的在前
  const MAX = 1200;
  const stride = stored.length > MAX ? stored.length / MAX : 1;
  const list = [];
  const born = performance.now();
  for (let i = 0; i < stored.length; i += stride){
    const rec = stored[Math.floor(i)];
    const s = hash(rec.id);
    const ageRank = stored.length > 1 ? i / (stored.length - 1) : 1; // 0 最旧，1 最新
    list.push({
      rec,
      nx: 0.12 + ((s % 1000) / 1000) * 0.76,
      // 越旧越沉：最新在瓶口，最旧在瓶底
      ny: 0.14 + (1 - ageRank) * 0.72 + ((((s >>> 10) % 1000) / 1000) - 0.5) * 0.04,
      size: 2.1 + ageRank * 1.4,
      a: 0.36 + ageRank * 0.50,
      ph: (s % 628) / 100,
      // 开瓶时从瓶底轻轻浮回自己的位置
      born: born + (1 - ageRank) * 220 + ((s >>> 5) % 220),
      fx: 0.5 + (((s >>> 15) % 1000) / 1000 - 0.5) * 0.16,
      fy: 1.02 + ((s >>> 25) % 100) / 100 * 0.04,
      cx: null,
      cy: null
    });
  }
  jarParticles = list;
}

function sizeJar(){
  const r = jarVessel.getBoundingClientRect();
  if (!r.width || !r.height) return;
  jarDpr = Math.min(devicePixelRatio || 1, 2);
  jarW = r.width;
  jarH = r.height;
  jarCanvas.width = Math.max(1, Math.floor(jarW * jarDpr));
  jarCanvas.height = Math.max(1, Math.floor(jarH * jarDpr));
  jarCtx.setTransform(jarDpr, 0, 0, jarDpr, 0, 0);
}

function clampJarPan(){
  const minX = jarW * (1 - jarScale);
  const minY = jarH * (1 - jarScale);
  jarPanX = clamp(jarPanX, minX, 0);
  jarPanY = clamp(jarPanY, minY, 0);
}

function updateJarReset(){
  jarReset.classList.toggle('show', jarScale > 1.02);
}

function resetJarView(){
  jarScale = 1;
  jarPanX = 0;
  jarPanY = 0;
  updateJarReset();
}

function drawJar(now){
  jarCtx.setTransform(jarDpr, 0, 0, jarDpr, 0, 0);
  jarCtx.clearRect(0, 0, jarW, jarH);

  const g = jarCtx.createRadialGradient(jarW/2, jarH*0.92, 0, jarW/2, jarH*0.92, jarW*0.95);
  g.addColorStop(0, 'rgba(255,180,120,0.10)');
  g.addColorStop(0.5, 'rgba(255,170,110,0.03)');
  g.addColorStop(1, 'rgba(255,170,110,0)');
  jarCtx.fillStyle = g;
  jarCtx.fillRect(0, 0, jarW, jarH);

  jarCtx.save();
  jarCtx.translate(jarPanX, jarPanY);
  jarCtx.scale(jarScale, jarScale);
  jarCtx.globalCompositeOperation = 'lighter';

  for (const p of jarParticles){
    const t = clamp((now - p.born) / 1050, 0, 1);
    const e = 1 - Math.pow(1 - t, 3);
    const tx = p.nx + Math.sin(now * 0.00011 + p.ph) * 0.010;
    const ty = p.ny + Math.cos(now * 0.00009 + p.ph * 1.3) * 0.008;
    const x = (p.fx + (tx - p.fx) * e) * jarW;
    const y = (p.fy + (ty - p.fy) * e) * jarH;
    p.cx = e > 0.04 ? x : null;
    p.cy = e > 0.04 ? y : null;

    const a = clamp(p.a * (0.82 + 0.18 * Math.sin(now * 0.0011 + p.ph)), 0, 1) * e;

    if (p.size > 2.35){
      const sp = spriteFor(p.rec.light);
      const d = p.size * 10 * (0.72 + 0.28 * e);
      jarCtx.globalAlpha = a;
      jarCtx.drawImage(sp, x - d/2, y - d/2, d, d);
    }

    jarCtx.globalAlpha = clamp(a * 0.95, 0, 1);
    jarCtx.fillStyle = '#FFF8EC';
    jarCtx.beginPath();
    jarCtx.arc(x, y, Math.max(0.6, p.size * 0.34) * (0.5 + 0.5 * e), 0, Math.PI * 2);
    jarCtx.fill();
  }
  jarCtx.restore();
  jarCtx.globalAlpha = 1;
}

function jarFrame(now){
  if (!jarView.classList.contains('open')){
    cancelAnimationFrame(jarRaf);
    jarRaf = 0;
    return;
  }
  drawJar(now);
  jarRaf = requestAnimationFrame(jarFrame);
}

function openJar(){
  closeJarSheet();
  jarSearch.value = '';
  jarSearchTerm = '';
  setJarScope('all');
  resetJarView();
  buildJarParticles();
  jarTotalEl.textContent = storedRecords().length;
  jarView.classList.add('open');
  sizeJar();
  if (!jarRaf) jarRaf = requestAnimationFrame(jarFrame);
}

function closeJar(){
  jarView.classList.remove('open');
  if (jarSheetOpen) closeJarSheet();
  if (jarRaf){ cancelAnimationFrame(jarRaf); jarRaf = 0; }
  jarGesture.pointers.clear();
  jarGesture.start = null;
  jarGesture.pinch = null;
}

function selectJarLight(x, y){
  let best = null;
  let bestD = 26 / jarScale;
  for (const p of jarParticles){
    if (p.cx == null) continue;
    const d = Math.hypot(p.cx - x, p.cy - y);
    if (d < bestD){ bestD = d; best = p; }
  }
  if (best) openViewer(best.rec);
}

jarCanvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try{ jarCanvas.setPointerCapture(e.pointerId); }catch(err){}
  jarGesture.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (jarGesture.pointers.size === 1){
    jarGesture.start = { x: e.clientX, y: e.clientY, panX: jarPanX, panY: jarPanY, moved: false };
    jarGesture.tapAt = performance.now();
  }else if (jarGesture.pointers.size === 2){
    const pts = Array.from(jarGesture.pointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
    const r = jarCanvas.getBoundingClientRect();
    const mx = (pts[0].x + pts[1].x) / 2 - r.left;
    const my = (pts[0].y + pts[1].y) / 2 - r.top;
    jarGesture.start = null;
    jarGesture.pinch = { dist, scale: jarScale, mx, my, panX: jarPanX, panY: jarPanY };
  }
});

jarCanvas.addEventListener('pointermove', (e) => {
  if (!jarGesture.pointers.has(e.pointerId)) return;
  jarGesture.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (jarGesture.pointers.size >= 2 && jarGesture.pinch){
    const pts = Array.from(jarGesture.pointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
    const r = jarCanvas.getBoundingClientRect();
    const mx = (pts[0].x + pts[1].x) / 2 - r.left;
    const my = (pts[0].y + pts[1].y) / 2 - r.top;
    const p = jarGesture.pinch;
    const next = clamp(p.scale * (dist / p.dist), 1, 5);
    const cx = (p.mx - p.panX) / p.scale;
    const cy = (p.my - p.panY) / p.scale;
    jarScale = next;
    jarPanX = mx - cx * next;
    jarPanY = my - cy * next;
    clampJarPan();
    updateJarReset();
    return;
  }

  if (jarGesture.pointers.size === 1 && jarGesture.start){
    const s = jarGesture.start;
    const dx = e.clientX - s.x;
    const dy = e.clientY - s.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) s.moved = true;
    if (jarScale > 1){
      jarPanX = s.panX + dx;
      jarPanY = s.panY + dy;
      clampJarPan();
    }
  }
});

jarCanvas.addEventListener('pointerup', (e) => {
  const single = jarGesture.pointers.size === 1;
  jarGesture.pointers.delete(e.pointerId);
  if (jarGesture.pointers.size < 2) jarGesture.pinch = null;

  if (single){
    const s = jarGesture.start;
    const dt = performance.now() - (jarGesture.tapAt || 0);
    jarGesture.start = null;
    if (s && !s.moved && dt < 450){
      const r = jarCanvas.getBoundingClientRect();
      const x = (e.clientX - r.left - jarPanX) / jarScale;
      const y = (e.clientY - r.top - jarPanY) / jarScale;
      selectJarLight(x, y);
    }
  }
});

jarCanvas.addEventListener('pointercancel', (e) => {
  jarGesture.pointers.delete(e.pointerId);
  if (jarGesture.pointers.size < 2) jarGesture.pinch = null;
  jarGesture.start = null;
});

jarCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

  if (jarView.classList.contains('open')){
    sizeJar();

  }
});

const jarSheet = $('#jarSheet');

const WEEK_LABELS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const escHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

function dayStart(ts){
  const d = new Date(ts);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}

function dayKey(ts){ return String(dayStart(ts)); }

function dayLabel(ts){
  const d = new Date(ts);
  const diff = Math.round((dayStart(Date.now()) - dayStart(ts)) / 86400000);
  const md = `${d.getMonth()+1}月${d.getDate()}日 · ${WEEK_LABELS[d.getDay()]}`;
  if (diff === 0) return `今天 · ${md}`;
  if (diff === 1) return `昨天 · ${md}`;
  if (diff === 2) return `前天 · ${md}`;
  if (d.getFullYear() === new Date().getFullYear()) return md;
  return `${d.getFullYear()}年${md}`;
}

function fmtRel(ts){
  const diff = Math.round((dayStart(Date.now()) - dayStart(ts)) / 86400000);
  if (diff === 0) return `今天 ${fmtTime(ts)}`;
  if (diff === 1) return `昨天 ${fmtTime(ts)}`;
  if (diff === 2) return `前天 ${fmtTime(ts)}`;
  return `${fmtDate(ts)} · ${fmtTime(ts)}`;
}

function recDigest(rec){
  const extras = rec.extras || [];
  const video = rec.type === 'video';
  const voice = rec.type === 'voice' || extras.some(x => x.kind === 'voice');
  const photo = rec.type === 'photo' || video || extras.some(x => x.kind === 'photo');
  let mid = null;
  if (rec.type === 'photo' || video) mid = rec.id;
  else {
    const p = extras.find(x => x.kind === 'photo');
    if (p) mid = p.mid;
  }
  return { text: rec.text || '', video, voice, photo, mid };
}

function quietLabel(d){
  if (d.video) return '一段影像';
  if (d.photo) return '一张照片';
  if (d.voice) return '一段声音';
  return '一刻安静';
}

function recMatches(rec, q){
  if ((rec.text || '').toLowerCase().includes(q)) return true;
  const d = new Date(rec.ts);
  const hay = [
    fmtDate(rec.ts),
    `${d.getMonth()+1}月${d.getDate()}日`,
    `${d.getMonth()+1}月`,
    `${d.getDate()}日`,
    `${d.getFullYear()}年`,
    WEEK_LABELS[d.getDay()],
    fmtTime(rec.ts),
    dayLabel(rec.ts),
    quietLabel(recDigest(rec))
  ].join(' ').toLowerCase();
  return hay.includes(q);
}

function jarRowHtml(rec, idx){
  const d = recDigest(rec);
  const color = lightColor(rec.light);
  const jit = hash(rec.id) % 15;
  const text = d.text
    ? `<span class="jar-row-text">${escHtml(d.text)}</span>`
    : `<span class="jar-row-text jar-quiet">${quietLabel(d)}</span>`;
  const badges = [];
  if (d.voice) badges.push('<span class="jar-badge">声</span>');
  if (d.photo) badges.push(`<span class="jar-badge">${d.video ? '影 · 动' : '影'}</span>`);
  const thumb = d.mid
    ? `<span class="jar-thumb" data-mid="${escHtml(d.mid)}" data-video="${d.video ? '1' : '0'}">${d.video ? '<i>▶</i>' : ''}</span>`
    : '';
  return `<button class="jar-row" data-id="${escHtml(rec.id)}" style="--jit:${jit}px;--i:${Math.min(idx, 10)}">
      <span class="jar-anchor" style="color:${color}"><i></i><span class="jar-lead"></span></span>
      <span class="jar-row-main">
        <span class="jar-when">${fmtTime(rec.ts)}</span>
        ${text}${badges.length ? `<span class="jar-badges">${badges.join('')}</span>` : ''}
      </span>
      ${thumb}
    </button>`;
}

function stopThumbObserver(){
  if (jarThumbObserver){
    jarThumbObserver.disconnect();
    jarThumbObserver = null;
  }
}

function releaseThumbs(){
  stopThumbObserver();
  const urls = Array.from(jarThumbUrls.values());
  jarThumbUrls.clear();
  if (!urls.length) return;
  // 让收起动画走完再释放，避免缩略图在淡出时先消失
  setTimeout(() => {
    urls.forEach((url) => { try{ URL.revokeObjectURL(url); }catch(e){} });
  }, 620);
}

function hydrateThumbs(){
  const nodes = Array.from(jarListEl.querySelectorAll('.jar-thumb[data-mid]'));
  if (!nodes.length) return;

  const apply = (el, url) => {
    el.style.backgroundImage = `url("${url}")`;
    el.classList.add('ready');
  };

  const load = async (el) => {
    const mid = el.dataset.mid;
    if (jarThumbUrls.has(mid)){ apply(el, jarThumbUrls.get(mid)); return; }
    if (el.dataset.video === '1') return;
    let blob = null;
    try{ blob = await mediaGet(mid); }catch(e){}
    if (!blob || !el.isConnected) return;
    const url = URL.createObjectURL(blob);
    jarThumbUrls.set(mid, url);
    apply(el, url);
  };

  if (!('IntersectionObserver' in window)){
    nodes.forEach(load);
    return;
  }

  const wait = [];
  nodes.forEach((el) => {
    if (el.dataset.video === '1') return;
    const mid = el.dataset.mid;
    if (jarThumbUrls.has(mid)) apply(el, jarThumbUrls.get(mid));
    else wait.push(el);
  });

  // 第一屏的先取，不等滚动
  wait.slice(0, 8).forEach(load);

  jarThumbObserver = new IntersectionObserver((entries) => {
    for (const en of entries){
      if (!en.isIntersecting) continue;
      jarThumbObserver.unobserve(en.target);
      load(en.target);
    }
  }, { root: jarListEl, rootMargin: '240px 0px' });

  wait.slice(8).forEach(el => jarThumbObserver.observe(el));
}

function renderJarList(){
  const keepScroll = jarListEl.scrollTop;
  stopThumbObserver();

  const counts = { all: records.length, jar: storedRecords().length };
  const allChip = jarSheet.querySelector('[data-scope="all"]');
  const jarChip = jarSheet.querySelector('[data-scope="jar"]');
  if (allChip) allChip.textContent = `全部 ${counts.all}`;
  if (jarChip) jarChip.textContent = `瓶底 ${counts.jar}`;

  const q = jarSearchTerm.trim().toLowerCase();
  const base = (jarScope === 'jar' ? storedRecords() : records.slice()).sort((a, b) => b.ts - a.ts);
  const items = q ? base.filter(r => recMatches(r, q)) : base;

  jarSheetSub.textContent = q
    ? (items.length ? `找到 ${items.length} 粒` : '没有找到')
    : `${jarScope === 'jar' ? '最旧的' : '共'} ${items.length} 粒 · 从新到旧`;

  if (!items.length){
    jarListEl.innerHTML = `<div class="jar-empty">${q ? '换个词试试' : '这里还是空的'}</div>`;
    return;
  }

  let html = '';
  let last = null;
  let rowIndex = 0;
  for (const rec of items){
    const key = dayKey(rec.ts);
    if (key !== last){
      last = key;
      html += `<div class="jar-day">${dayLabel(rec.ts)}</div>`;
    }
    html += jarRowHtml(rec, rowIndex++);
  }

  jarListEl.innerHTML = html;
  jarListEl.scrollTop = keepScroll;
  hydrateThumbs();
}

async function usedSpace(){
  try{
    if (navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      if (est && est.usage) return `${(est.usage / 1048576).toFixed(1)} MB`;
    }
  }catch(e){}
  const bytes = records.reduce((s, r) => {
    const extra = (r.extras || []).reduce((a, e) => a + ((e.media && e.media.bytes) || 0), 0);
    return s + ((r.media && r.media.bytes) || 0) + extra;
  }, 0);
  return bytes ? `${(bytes / 1048576).toFixed(1)} MB` : '—';
}

  : '当前环境不支持录音与录像（需要 <b>https</b> 或 <b>localhost</b>）。<br>「此刻」照常可用。';

function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

function dataURLToBlob(dataUrl){
  const parts = String(dataUrl).split(',');
  const head = parts[0] || '';
  const mime = (head.match(/:(.*?);/) || [])[1] || 'application/octet-stream';
  const bin = atob(parts[1] || '');
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

const exportBtn = $('#exportBtn');
exportBtn.addEventListener('click', async () => {
  if (exportBtn.dataset.busy) return;
  exportBtn.dataset.busy = '1';
  const old = exportBtn.textContent;
  exportBtn.textContent = '整理中…';

  try{
    const out = { app: 'weiguang', version: 1, exportedAt: Date.now(), records: [] };
    let budget = 48 * 1024 * 1024;
    let skipped = 0;

    for (const r of records){
      const copy = { ...r };
      if (r.media){
        try{
          const blob = await mediaGet(r.id);
          if (blob && blob.size <= budget){
            budget -= blob.size;
            copy._data = await blobToDataURL(blob);
          }else if (blob){
            skipped++;
            copy._skipped = true;
          }
        }catch(e){ copy._skipped = true; }
      }
      if (r.extras && r.extras.length){
        copy.extras = [];
        for (const e of r.extras){
          const ec = { ...e };
          try{
            const blob = await mediaGet(e.mid);
            if (blob && blob.size <= budget){
              budget -= blob.size;
              ec._data = await blobToDataURL(blob);
            }else if (blob){
              skipped++;
              ec._skipped = true;
            }
          }catch(err){ ec._skipped = true; }
          copy.extras.push(ec);
        }
      }
      out.records.push(copy);
    }

    const json = JSON.stringify(out);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = `weiguang-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    hint(skipped ? `已导出，${skipped} 段媒体太大没带上` : '备份已导出', 3200);
  }catch(e){
    hint('导出失败了');
  }finally{
    exportBtn.textContent = old;
    delete exportBtn.dataset.busy;
  }
});

const importFile = $('#importFile');
$('#importBtn').addEventListener('click', () => importFile.click());

importFile.addEventListener('change', async () => {
  const file = importFile.files && importFile.files[0];
  importFile.value = '';
  if (!file) return;

  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.records)) throw new Error('bad backup');

    let added = 0;
    for (const item of data.records){
      if (!item || !item.id || records.some(r => r.id === item.id)) continue;
      const { _data, _skipped, extras, ...clean } = item;
      if (_data){
        try{ await mediaPut(clean.id, dataURLToBlob(_data)); }catch(e){}
      }
      if (Array.isArray(extras) && extras.length){
        clean.extras = [];
        for (const e of extras){
          if (!e || !e.mid) continue;
          const { _data: ed, _skipped: es, ...ec } = e;
          if (ed){
            try{ await mediaPut(ec.mid, dataURLToBlob(ed)); }catch(err){}
          }
          clean.extras.push(ec);
        }
      }
      records.push(clean);
      added++;
    }

    persist();
    rebuildMotes(true);
    updateCount();
    updateJar();
    $('#statCount').textContent = `${records.length} 粒`;
    $('#statSize').textContent = await usedSpace();
    hint(added ? `收回了 ${added} 粒光` : '这些光已经在这里了', 3200);
  }catch(e){
    hint('这个备份读不了');
  }
});

const clearBtn = $('#clearBtn');
clearBtn.addEventListener('click', async () => {

    setTimeout(() => { clearBtn.dataset.step = ''; clearBtn.textContent = '清空全部'; }, 3600);
    return;
  }
  try{
    const d = await db();
    await new Promise((resolve, reject) => {
      const tx = d.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).clear();
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){}
  localStorage.removeItem(LS_KEY);
  location.reload();
});

/* =========================================================
   15.5 放映
   ========================================================= */
const screeningEl = $('#screening');
const sStage = $('#sStage');
const sProgress = $('#sProgress');
const sHint = $('#sHint');

const screenState = {
  playing: false,
  list: [],
  i: 0,
  timer: 0,
  renderToken: 0,
  audio: null,
  urls: []
};

function clearScreenMedia(){
  if (screenState.audio){
    try{ screenState.audio.pause(); }catch(e){}
    screenState.audio = null;
  }
  sStage.querySelectorAll('video').forEach(v => { try{ v.pause(); }catch(e){} });
  screenState.urls.forEach(u => { try{ URL.revokeObjectURL(u); }catch(e){} });
  screenState.urls = [];
}

function startScreening(){
  if (screenState.playing) return;
  if (!records.length){ hint('暗房里还没有光'); return; }

  const sorted = records.slice().sort((a, b) => a.ts - b.ts);
  screenState.list = sorted.slice(-12);
  screenState.playing = true;
  screenState.i = 0;
  screenState.renderToken++;

  echoEl.classList.remove('show');
  echoId = null;

  settingsEl.classList.remove('open');
  screeningEl.classList.add('open');
  sProgress.style.transform = 'scaleX(0)';
  sStage.classList.remove('show');
  sStage.innerHTML = '';
  sHint.classList.add('show');
  setTimeout(() => sHint.classList.remove('show'), 3800);

  setTimeout(playScreenNext, 340);
}

function endScreening(){
  screenState.playing = false;
  screenState.renderToken++;
  clearTimeout(screenState.timer);
  clearScreenMedia();
  screeningEl.classList.remove('open');
  sStage.classList.remove('show');
  sStage.innerHTML = '';
  sProgress.style.transform = 'scaleX(0)';
}

function playScreenNext(){
  if (!screenState.playing) return;
  clearTimeout(screenState.timer);

  if (screenState.i >= screenState.list.length){
    endScreening();
    return;
  }

  const rec = screenState.list[screenState.i++];
  renderScreenItem(rec);

  const n = screenState.list.length;
  sProgress.style.transform = `scaleX(${(screenState.i / n).toFixed(4)})`;

  let dwell = 3600;
  const layer = rec.media
    ? { kind: rec.type, media: rec.media, mid: rec.id }
    : ((rec.extras || [])[0] || null);
  const dur = (layer && layer.media && layer.media.dur) || 0;
  if (layer && layer.kind === 'voice') dwell = Math.min(Math.max(dur, 3), 8) * 1000 + 1000;
  if (layer && layer.kind === 'video') dwell = Math.min(dur || 5, 5) * 1000 + 1400;

  screenState.timer = setTimeout(playScreenNext, dwell);
}

function renderScreenItem(rec){
  const my = ++screenState.renderToken;
  const color = lightColor(rec.light);
  const lightName = (LIGHT[rec.light] || {}).name || '';
  const layer = rec.media
    ? { kind: rec.type, media: rec.media, mid: rec.id }
    : ((rec.extras || [])[0] || null);

  clearScreenMedia();
  sStage.classList.remove('show');

  setTimeout(() => {
    if (my !== screenState.renderToken || !screenState.playing) return;

    sStage.innerHTML = `
      <div class="s-when"><i style="background:${color};color:${color}"></i>${fmtDate(rec.ts)} · ${fmtTime(rec.ts)} · ${lightName}</div>
      <div class="s-media"></div>
      ${rec.text ? '<div class="s-text"></div>' : ''}
    `;
    if (rec.text) sStage.querySelector('.s-text').textContent = rec.text;

    requestAnimationFrame(() => {
      if (my === screenState.renderToken) sStage.classList.add('show');
    });

    if (!layer) return;

    mediaGet(layer.mid).then((blob) => {
      if (!blob || my !== screenState.renderToken || !screenState.playing) return;
      const box = sStage.querySelector('.s-media');
      if (!box) return;

      const url = URL.createObjectURL(blob);
      screenState.urls.push(url);

      if (layer.kind === 'photo'){
        const img = document.createElement('img');
        img.alt = '';
        if (layer.media && layer.media.w && layer.media.h){
          img.width = layer.media.w;
          img.height = layer.media.h;
        }
        img.addEventListener('load', () => img.classList.add('ready'), { once: true });
        img.addEventListener('error', () => img.classList.add('ready'), { once: true });
        img.src = url;
        box.appendChild(img);
      }else if (layer.kind === 'video'){
        const v = document.createElement('video');
        if (layer.media && layer.media.w && layer.media.h){
          v.width = layer.media.w;
          v.height = layer.media.h;
        }
        v.addEventListener('loadeddata', () => v.classList.add('ready'), { once: true });
        v.addEventListener('error', () => v.classList.add('ready'), { once: true });
        v.src = url;
        v.playsInline = true;
        v.autoplay = true;
        v.muted = false;
        box.appendChild(v);
        v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
      }else if (layer.kind === 'voice'){
        box.innerHTML = `<div class="s-voice"><span class="wave"></span><span class="dur">${fmtDur((layer.media && layer.media.dur) || 0)}</span></div>`;
        const wave = box.querySelector('.wave');
        for (let i = 0; i < 14; i++){
          const b = document.createElement('b');
          b.style.height = (6 + Math.random() * 14) + 'px';
          b.style.animationDelay = (Math.random() * 1.2) + 's';
          wave.appendChild(b);
        }
        const audio = new Audio(url);
        screenState.audio = audio;
        audio.play().catch(() => {});
      }
    }).catch(() => {});
  }, 260);
}

$('#screenBtn').addEventListener('click', startScreening);
$('#screenClose').addEventListener('click', (e) => { e.stopPropagation(); endScreening(); });
screeningEl.addEventListener('click', () => { if (screenState.playing) playScreenNext(); });

/* =========================================================
   16. 回声
   ========================================================= */
function pickEcho(){
  if (!records.length) return null;
  const now = new Date();
  const pool = records.filter(r => r.id !== viewerOpenId);

  const sameDay = pool.filter(r => {
    const d = new Date(r.ts);
    return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() < now.getFullYear();
  });
  if (sameDay.length) return { rec: sameDay[Math.floor(Math.random() * sameDay.length)], label: '去年今天' };

  const sameLight = pool.filter(r => {
    const d = new Date(r.ts);
    return r.light === lightAt(now.getTime()) && (now - d) > 20 * 86400000;
  });
  if (sameLight.length) return { rec: sameLight[Math.floor(Math.random() * sameLight.length)], label: '同一种光' };

  const old = pool.filter(r => (now - new Date(r.ts)) > 3 * 86400000);
  if (old.length) return { rec: old[Math.floor(Math.random() * old.length)], label: '某一天' };

  return null;
}

let echoTimer = 0;
function runEcho(delay){
  clearTimeout(echoTimer);
  echoTimer = setTimeout(() => {
    const picked = pickEcho();
    if (!picked) return;
    const { rec, label } = picked;
    echoId = rec.id;

    echoDotEl.style.color = lightColor(rec.light);
    echoDotEl.style.background = lightColor(rec.light);
    echoWhenEl.textContent = `${label} · ${fmtTime(rec.ts)} · ${(LIGHT[rec.light] || {}).name || ''}`;
    echoQuoteEl.textContent = rec.text || '';
    echoQuoteEl.style.display = rec.text ? 'block' : 'none';
    echoEl.classList.add('show');

    setTimeout(() => {
      echoEl.classList.remove('show');
      setTimeout(() => { echoId = null; }, 1400);
    }, 3400);
  }, delay);
}

/* =========================================================
   17. 点击浮尘
   ========================================================= */
function aimPointer(e){
  const rect = canvas.getBoundingClientRect();
  pointerAim.x = e.clientX - rect.left;
  pointerAim.y = e.clientY - rect.top;
  pointerAim.on = 1;
}
canvas.addEventListener('pointermove', aimPointer);
canvas.addEventListener('pointerdown', aimPointer);
canvas.addEventListener('pointerleave', () => { pointerAim.on = 0; });
window.addEventListener('pointerup', () => {
  setTimeout(() => { pointerAim.on = 0; }, 240);
});

canvas.addEventListener('pointerup', (e) => {
  if (recordingMode) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  let best = null, bestD = 30;
  for (const m of motes){
    if (m.x == null) continue;
    const d = Math.hypot(m.x - x, m.y - y);
    if (d < bestD){ bestD = d; best = m; }
  }
  if (best) openViewer(best.rec);
});

/* 键盘弹起时，让底部面板停在键盘上方 */
const vv = window.visualViewport;
function syncKeyboard(){
  let kb = 0;
  if (vv && vv.scale <= 1.05){
    kb = Math.round(window.innerHeight - vv.height - vv.offsetTop);
    kb = clamp(kb, 0, Math.round(window.innerHeight * 0.6));
  }
  document.documentElement.style.setProperty('--kb', (kb > 60 ? kb : 0) + 'px');
}
if (vv){
  vv.addEventListener('resize', syncKeyboard);
  vv.addEventListener('scroll', syncKeyboard);
}
window.addEventListener('resize', syncKeyboard);
syncKeyboard();

document.addEventListener('visibilitychange', () => {
  if (document.hidden){

    if (screenState.playing) endScreening();

});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    if (screeningEl.classList.contains('open')) endScreening();
    else if (sheet.classList.contains('open')) closeTextSheet();
    else if (attachSheet.classList.contains('open')) closeAttachSheet();
    else if (cameraEl.classList.contains('open')) closeCamera();
    else if (settingsEl.classList.contains('open')) settingsEl.classList.remove('open');
    else if (viewerEl.classList.contains('open')) closeViewer();
    else if (jarSheetOpen) closeJarSheet();
    else if (jarView.classList.contains('open')) closeJar();
  }
  if (e.code === 'Space' && !sheet.classList.contains('open') &&
      !viewerEl.classList.contains('open') && !cameraEl.classList.contains('open') &&
      !settingsEl.classList.contains('open') && !screeningEl.classList.contains('open')){
    e.preventDefault();
    momentKey.click();

});
